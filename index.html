<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>Word Smash</title>
<meta name="description" content="AI-generated party game cards, themed for your group." />

<!-- PWA / installable app -->
<link rel="manifest" href="./manifest.webmanifest" />
<meta name="theme-color" content="#0d0a1c" />
<link rel="apple-touch-icon" href="./apple-touch-icon.png" />
<link rel="icon" type="image/png" href="./icon-192.png" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Word Smash" />

<style>
  :root {
    /* MAS brand palette — cyan / purple / gold / mint on near-black.
       Some var names are historical (e.g. --pink now holds brand cyan) to keep edits minimal. */
    --bg: #0B0F17;
    --panel: #121826;
    --panel-2: #1a2233;
    --ink: #ffffff;
    --muted: #93a1c0;
    --line: rgba(255,255,255,.14);
    --pink: #00E5FF;     /* primary accent — brand cyan */
    --violet: #8A2BE2;   /* brand purple */
    --cyan: #00E5FF;     /* brand cyan */
    --yellow: #FFD100;   /* brand gold */
    --orange: #8A2BE2;   /* gradient partner — purple (so cyan→purple gradients) */
    --mint: #00FFC6;     /* brand mint */
    --danger: #ff5470;
    --sat: env(safe-area-inset-top, 0px);
    --sab: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  /* The root canvas paints any strip the browser reserves (home indicator,
     collapsed toolbars) — end it in the same purple-black as the artwork so
     no hard edge can ever show below the app. */
  html { margin: 0; padding: 0; height: 100%; overscroll-behavior: none;
    background: #0b1019; }
  body { margin: 0; padding: 0; position: fixed; top: 0; left: 0; right: 0;
    height: 100%; height: 100lvh; overflow: hidden; overscroll-behavior: none; }
  body {
    font-family: ui-rounded, "SF Pro Rounded", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #0b1019; color: var(--ink); -webkit-font-smoothing: antialiased;
  }
  button, input, select, textarea { font-family: inherit; }

  .app {
    position: relative; max-width: 480px; margin: 0 auto;
    height: 100%; display: flex; flex-direction: column; overflow: hidden;
    background:
      radial-gradient(600px 380px at 92% 30%, rgba(0,229,255,.16) 0%, transparent 55%),
      radial-gradient(520px 420px at 50% 118%, rgba(138,43,226,.42) 0%, transparent 58%),
      radial-gradient(420px 320px at 12% 100%, rgba(255,209,0,.14) 0%, transparent 55%),
      linear-gradient(180deg, #0a0e16, var(--bg));
  }

  header.bar {
    /* Persistent app bar: stays on top of every screen/overlay */
    display: flex; align-items: center; gap: 8px; position: relative; flex: 0 0 auto;
    padding: calc(8px + var(--sat)) 14px 8px; z-index: 80;
    background: #0b1019;
  }
  header.bar::after { content: ""; position: absolute; left: 16px; right: 16px; bottom: 0; height: 2px; border-radius: 2px;
    background: linear-gradient(90deg, transparent, var(--cyan) 28%, var(--violet) 72%, transparent);
    box-shadow: 0 0 12px rgba(0,229,255,.45); opacity: .85; }
  /* screens that carry their own big heading don't need the mark or the rule */
  body.chrome-bare header.bar::after { display: none; }
  /* One continuous field for the whole home screen. The bar, .empty and .app
     each used to paint their own background, and with the rule gone the joins
     between those three tones showed as bands. Only .app paints now. */
  /* flat near-black so the bar melts into the video's own dark starfield */
  body.is-home .app { background: #04060c; }
  body.is-home { background: #04060c; }
  /* in a game the body, app and live view share one colour: any strip the
     browser leaves uncovered (toolbar dance, safe areas) blends invisibly */
  body.in-game, body.in-game .app { background: #0b1019; }
  body.is-home header.bar { background: transparent; }
  body.chrome-bare header.bar { background: transparent; }
  body.is-home .empty { background: none; }
  /* branding only — resetting moved to Menu -> Reset game */
  .brand { display: flex; align-items: center; gap: 10px; flex: 0 0 auto; min-width: 0; border-radius: 12px; }
  /* Current screen name: full width under the rule, not squeezed into the bar */
  /* Sits between the bar and the overlays, so it needs its own layer above them
     and its height folded into --headerH or the overlays would cover it. */
  .pagehead { flex: 0 0 auto; padding: 13px 18px 3px; font-size: 26px; font-weight: 900;
    letter-spacing: -.3px; color: #eaf1ff; line-height: 1.15;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    position: relative; z-index: 70; background: #0b1019; }
  .pagehead[hidden] { display: none; }
  .logo { height: 42px; width: auto; max-width: 148px; flex: none; object-fit: contain; filter: drop-shadow(0 3px 10px rgba(0,229,255,.45)); }
  header.bar .title { font-weight: 900; font-size: 18px; line-height: 1; letter-spacing: .3px;
    background: linear-gradient(90deg, #fff, var(--yellow)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .subhead { padding: 9px 16px 4px; font-size: 15px; font-weight: 800; letter-spacing: .2px; color: #c8d4ec;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .grow { flex: 1; }
  .iconbtn {
    width: 34px; height: 34px; border: none; background: transparent; color: #fff;
    font-size: 18px; display: grid; place-items: center; cursor: pointer; padding: 0; }
  .iconbtn:active { transform: scale(.88); }
  /* .iconbtn sets display:grid, and an author display rule beats the UA's
     [hidden]{display:none} — without this the hidden ✕ still rendered. */
  .iconbtn[hidden] { display: none; }
  /* Claim the focus ring, or the OS draws its own in the system accent colour —
     that's the gold ring that appeared round the gear after tapping it. */
  .iconbtn:focus { outline: none; }
  .iconbtn:focus-visible { outline: 2px solid var(--cyan); outline-offset: 3px; }
  /* Close / small action buttons: the same glass-in-a-gradient-edge as the home
     screen buttons, so a bare ✕ glyph doesn't read as unstyled. Deliberately
     NOT on plain .iconbtn — the header gear must stay box-free. */
  .iconbtn.close, .iconbtn.chip {
    width: 36px; height: 36px; border-radius: 50%; position: relative; flex: none;
    border: 1.5px solid transparent;
    background: linear-gradient(180deg, #182033, #0d1220) padding-box,
                linear-gradient(140deg, var(--cyan), var(--violet)) border-box;
    box-shadow: 0 4px 14px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.10);
    transition: transform .12s ease, box-shadow .12s ease; }
  .iconbtn.close:active, .iconbtn.chip:active { transform: scale(.9);
    box-shadow: 0 0 18px rgba(0,229,255,.35), inset 0 1px 0 rgba(255,255,255,.08); }
  /* the ✕ is drawn, not typed — two strokes read far cleaner than the glyph */
  .iconbtn.close { font-size: 0; }
  .iconbtn.close::before, .iconbtn.close::after {
    content: ""; position: absolute; left: 50%; top: 50%; width: 15px; height: 2px;
    border-radius: 2px; background: var(--cyan); box-shadow: 0 0 8px rgba(0,229,255,.7); }
  .iconbtn.close::before { transform: translate(-50%,-50%) rotate(45deg); }
  .iconbtn.close::after { transform: translate(-50%,-50%) rotate(-45deg); }
  .iconbtn.chip { color: var(--cyan); font-size: 17px; text-shadow: 0 0 8px rgba(0,229,255,.6); }
  /* the menu gear gets a thin ring only — a filled chip would fight the icon's
     own glow, and the header icons are meant to read as icons, not boxes */
  .iconbtn.ring { width: 34px; height: 34px; border-radius: 50%;
    border: 1.5px solid rgba(0,229,255,.5);
    box-shadow: 0 0 14px rgba(0,229,255,.16), inset 0 0 12px rgba(0,229,255,.07); }
  /* Header icons: Mas's icon pack, ONE 72px file each (deliberately no srcset).
     Multiple srcset candidates let the browser show one then swap to another,
     which read as a bright->dark blink. A single file has nothing to swap to,
     and each icon is pre-brightened so it holds up at 24/48/72px alike.
     Do NOT add a CSS filter here — that promotes a GPU layer that
     re-rasterizes after load. Brightness/glow are baked into the PNGs. */
  .ico { width: 24px; height: 24px; display: block; }

  main.stage { flex: 1; position: relative; display: flex; flex-direction: column; min-height: 0; }

  /* tap-to-flip deck (phone = the deck) */
  .flipwrap { width: 100%; max-width: 340px; aspect-ratio: 3/4.2; perspective: 1500px; position: relative; }
  /* stacked-deck illusion behind the top card */
  .flipwrap::before, .flipwrap::after { content: ""; position: absolute; inset: 0; border-radius: 26px; background: linear-gradient(150deg, var(--violet), var(--pink)); border: 3px solid rgba(255,255,255,.35); z-index: -1; }
  .flipwrap::before { transform: translate(7px, 9px) rotate(2.5deg); opacity: .55; }
  .flipwrap::after { transform: translate(-6px, 5px) rotate(-2deg); opacity: .4; }
  .face { position: absolute; inset: 0; -webkit-backface-visibility: hidden; backface-visibility: hidden; border-radius: 26px; padding: 22px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 22px 55px rgba(0,0,0,.45), 0 0 0 6px rgba(255,255,255,.06); border: 3px solid rgba(255,255,255,.5); }
  .face.front { transform: rotateY(180deg); background: linear-gradient(155deg, var(--c1, #ff2d78), var(--c2, #7c3aed));
    color: var(--ink, #fff); }
  .face.back { align-items: center; justify-content: center; text-align: center;
    background:
      radial-gradient(130% 100% at 50% 0%, rgba(0,229,255,.12), transparent 55%),
      radial-gradient(130% 100% at 50% 100%, rgba(138,43,226,.16), transparent 55%),
      radial-gradient(115% 90% at 50% 45%, #0e1524 0%, #05070c 74%); border-color: rgba(0,229,255,.5); }
  .backlogo-img { width: 84%; max-width: 260px; height: auto; aspect-ratio: 1/1; object-fit: contain; filter: drop-shadow(0 6px 20px rgba(0,229,255,.3)); }
  .backword { font-weight: 900; font-size: 22px; letter-spacing: .2em; text-transform: uppercase; color: #fff; text-shadow: 0 2px 10px rgba(0,0,0,.4); }
  @keyframes pulse { 0%,100% { transform: scale(1); opacity: .88; } 50% { transform: scale(1.06); opacity: 1; } }
  /* card front inner content (shared with cardInner) */
  .cardface .badge { align-self: flex-start; font-size: 11px; font-weight: 900; text-transform: uppercase; letter-spacing: .1em; padding: 7px 13px; border-radius: 999px; background: rgba(0,0,0,.28); color: #fff; }
  /* on the light categories a black wash would be invisible — flip the chip */
  .cardface.onlight .badge, .mini.onlight .badge { background: rgba(255,255,255,.30); color: inherit; }
  .cardface .main { flex: 1; display: flex; align-items: center; justify-content: center; text-align: center; font-weight: 900; line-height: 1.12; padding: 10px 0; text-shadow: 0 2px 10px rgba(0,0,0,.18); }
  .cardface .main.sm { font-size: 25px; } .cardface .main.md { font-size: 31px; } .cardface .main.lg { font-size: 38px; }
  .cardface .lines { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }
  .cardface .lines .li { background: rgba(0,0,0,.32); border-radius: 11px; padding: 10px 12px; font-size: 15px; font-weight: 700; text-align: center; color: #fff; }
  /* no big title (e.g. Articulate): let the list fill & centre the card */
  .cardface .lines.solo { flex: 1; justify-content: center; margin-top: 0; }
  /* long lists (e.g. Scattergories 12): shrink rows, allow scroll */
  .cardface .lines.many { gap: 5px; }
  .cardface .lines.many .li { font-size: 13px; padding: 6px 9px; font-weight: 600; }
  .cardface.listcard .main { flex: 0 0 auto; padding: 4px 0 8px; }
  .cardface.listcard .lines.many { flex: 1; min-height: 0; overflow-y: auto; justify-content: flex-start; }
  /* Scattergories letter roller */
  .rollbar { display: flex; align-items: center; gap: 12px; }
  .rollbar .rlabel { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  .rollbar #rollLetter { font-size: 40px; font-weight: 900; width: 66px; height: 66px; display: grid; place-items: center; border-radius: 18px; color: #fff;
    background: linear-gradient(135deg, var(--cyan), var(--violet)); border: 3px solid rgba(255,255,255,.55); box-shadow: 0 10px 26px rgba(0,0,0,.35); }
  .rollbar.pop #rollLetter { animation: pop .32s ease; }
  @keyframes pop { 0% { transform: scale(.6); } 60% { transform: scale(1.15); } 100% { transform: scale(1); } }
  .cardface .note { font-size: 13px; color: inherit; opacity: .9; text-align: center; margin-top: 12px; font-weight: 600; }

  .controls-row { display: flex; align-items: center; justify-content: center; gap: 16px; padding: 6px 16px calc(10px + var(--sab)); }
  .navbtn { width: 58px; height: 58px; border-radius: 50%; border: none; color: #fff; font-size: 24px; cursor: pointer; font-weight: 900;
    background: linear-gradient(135deg, var(--pink), var(--orange)); box-shadow: 0 8px 22px rgba(255,45,120,.45); }
  .navbtn:active { transform: scale(.9); }
  .navbtn:disabled { opacity: .4; box-shadow: none; }
  .counter { min-width: 78px; text-align: center; font-weight: 900; font-size: 16px; }
  .counter small { display: block; color: var(--muted); font-weight: 600; font-size: 11px; margin-top: 2px; }
  .chip { flex: 0 0 auto; border: 2px solid var(--line); background: rgba(255,255,255,.08); color: #fff; border-radius: 999px; padding: 8px 15px; font-size: 13px; font-weight: 800; cursor: pointer; white-space: nowrap; }
  .chip:active { transform: scale(.95); }

  /* Home screen: the whole backdrop is one animated scene (logo baked in), with
     the strapline and buttons overlaid on its lower third. */
  /* Original home rhythm, new artwork: the badge is baked into the video's top
     ~third, so padding-top clears it and space-evenly seats the strapline just
     beneath the badge with the buttons floating in the lower half — the same
     logo → strapline → buttons cadence the old three-block layout had. */
  .empty { position: relative; flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: flex-start; gap: 0;
    text-align: center; padding: calc(40vh - 52px) 18px max(calc(12px + var(--sab)), 40px); color: var(--muted); min-height: 0;
    background: #04060c; }
  /* Pinned to the physical screen (largest viewport), not the layout box —
     flex rounding and browser chrome left slivers below a box-anchored video.
     Runs up behind the transparent bar; the bar sits at z 80, still tappable. */
  .homebg { position: fixed; top: 0; left: 50%; transform: translateX(-50%);
    width: min(100vw, 480px); height: 100%; height: 100lvh;
    object-fit: cover; object-position: center top; z-index: 0; }
  /* dark ramp at the bottom so the buttons sit on something quiet */
  .homeveil { position: fixed; top: 0; left: 50%; transform: translateX(-50%);
    width: min(100vw, 480px); height: 100%; height: 100lvh; z-index: 1; pointer-events: none;
    background: linear-gradient(180deg, rgba(4,6,12,.25) 0%, rgba(4,6,12,0) 20%,
      rgba(4,6,12,0) 52%, rgba(4,6,12,.72) 86%, #04060c 100%); }
  .empty .tagblock, .empty .home-actions { position: relative; z-index: 2; }
  /* in normal flow under the buttons — the bottom edge is clip territory on
     installed iOS, so nothing readable lives down there */
  .verbadge { position: relative; z-index: 2; margin-top: 14px; text-align: center;
    font-size: 10px; font-weight: 700; letter-spacing: .08em;
    color: rgba(255,255,255,.42); }
  /* tap the version: coloured bars, each pinned a different way — whichever
     colour reaches the physical bottom edge is the anchoring iOS honours */
  .dbgbar { position: fixed; top: 0; width: 8px; z-index: 200; pointer-events: none; }
  .dbgbar.r { right: 2px;  background: #ff3355; height: 100lvh; }
  .dbgbar.y { right: 14px; background: #ffd100; height: 100vh; }
  .dbgbar.c { right: 26px; background: #00e5ff; bottom: 0; height: auto; }
  .dbgbar.g { right: 38px; background: #43e97b; height: 100svh; }
  /* strapline + its rule travel together as one block, so the even spacing
     applies between logo / strapline / buttons and not inside the pair */
  .tagblock { flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; gap: 9px;
    margin-bottom: 78px; }
  .tagline { flex: 0 0 auto; margin: 0; font-size: 15px; font-weight: 800; line-height: 1.4;
    color: #dbe4f5; text-transform: uppercase; letter-spacing: .09em; }
  /* hairline · diamond · hairline under the tagline */
  .tagrule { flex: 0 0 auto; display: flex; align-items: center; gap: 10px; width: 190px; }
  .tagrule span { flex: 1; height: 1px; }
  .tagrule span:first-child { background: linear-gradient(90deg, transparent, var(--cyan)); }
  .tagrule span:last-child { background: linear-gradient(90deg, var(--violet), transparent); }
  .tagrule i { width: 7px; height: 7px; flex: none; transform: rotate(45deg); border-radius: 1px;
    background: #fff; box-shadow: 0 0 8px rgba(255,255,255,.8); }
  .home-actions { flex: 0 0 auto; width: 100%; max-width: 250px; display: flex; flex-direction: column; gap: 8px; }
  .spinner { width: 18px; height: 18px; border: 3px solid rgba(255,255,255,.35); border-top-color: #fff; border-radius: 50%; display: inline-block; animation: spin .7s linear infinite; vertical-align: -3px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  /* Above the live view (55) and the sheet (50), under the app bar (80): a
     message nobody can see is not a message, and every in-game toast — time's
     up, skip gone, board link copied — was landing behind the game screen. */
  .toast { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(100px + var(--sab)); background: rgba(0,0,0,.82); color: #fff; padding: 11px 18px; border-radius: 999px; font-size: 13px; font-weight: 700; z-index: 78; max-width: calc(100% - 20px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: center; }
  .toast.err { background: var(--danger); }

  /* Undo pill: the same spot as the toast, but tappable. Sits above the footer
     buttons so the thumb that just hit "Got it" is already in the right place.
     It fades on its own; the bar underneath drains to show the time left. */
  .undobar { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(124px + var(--sab));
    z-index: 79; display: flex; align-items: center; gap: 12px; padding: 8px 8px 8px 16px;
    background: rgba(0,0,0,.86); border: 1px solid rgba(255,255,255,.14); border-radius: 999px;
    font-size: 13px; font-weight: 800; color: #dbe4f7; white-space: nowrap; overflow: hidden;
    /* the slide is decoration only — nothing about being visible is left to the
       animation, so a backgrounded tab (where animations sit frozen at their
       first frame) still shows a solid, tappable pill */
    animation: undoin .18s ease-out; }
  .undobar.out { opacity: 0; transition: opacity .2s; }
  .undobar button { appearance: none; border: none; cursor: pointer; padding: 8px 15px; border-radius: 999px;
    font: inherit; font-weight: 900; letter-spacing: .02em; color: #04060c;
    background: linear-gradient(120deg, #00E5FF, #8A2BE2); }
  .undobar button:active { transform: translateY(1px); }
  .undobar i { position: absolute; left: 0; bottom: 0; height: 2px; background: rgba(255,255,255,.4);
    width: 100%; transform-origin: left; animation: undodrain var(--ud, 4s) linear both; }
  @keyframes undoin { from { transform: translate(-50%, 10px); } to { transform: translate(-50%, 0); } }
  @keyframes undodrain { to { transform: scaleX(0); } }

  /* Settings hint under a row of pickers */
  .sethint { margin: 10px 2px 0; font-size: 12.5px; line-height: 1.5; color: rgba(219,228,247,.6); }

  /* Overlays sit BELOW the persistent header (--headerH set from JS) */
  /* All cards is a popup, not a page: it layers over the menu so closing it
     puts you straight back where you were instead of unwinding a screen. */
  /* above the menu sheet (z 50), below the popup itself — the shared .scrim is
     z 45, which dimmed the app but left the sheet bright behind the popup */
  #cardsScrim { z-index: 56; }
  .cardspop { position: absolute; left: 12px; right: 12px; top: 50%; transform: translateY(-50%) scale(.96);
    max-height: 78dvh; z-index: 58; display: none; flex-direction: column; overflow: hidden;
    border-radius: 22px; border: 1px solid rgba(255,255,255,.09);
    background: linear-gradient(180deg, #141c2f, #0a0e1c);
    box-shadow: 0 26px 70px rgba(0,0,0,.7); opacity: 0; transition: opacity .18s, transform .18s; }
  .cardspop.open { display: flex; opacity: 1; transform: translateY(-50%) scale(1); }
  .cardspop-head { display: flex; align-items: center; gap: 12px; padding: 14px 14px 12px;
    border-bottom: 1px solid var(--line); }
  .cph-txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .cph-txt b { font-size: 17px; font-weight: 900; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cph-txt small { font-size: 12px; font-weight: 700; color: var(--muted); }
  .grid-scroll { flex: 1; overflow-y: auto; overscroll-behavior: contain; padding: 12px;
    display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
  .mini { border-radius: 14px; padding: 10px; min-height: 92px; display: flex; flex-direction: column; background: linear-gradient(155deg, var(--c1), var(--c2)); border: 2px solid rgba(255,255,255,.4); cursor: pointer; color: var(--ink, #fff); }
  .mini .badge { font-size: 9px; align-self: flex-start; font-weight: 900; text-transform: uppercase; letter-spacing: .08em; background: rgba(0,0,0,.28); padding: 4px 9px; border-radius: 999px; }
  .mini .t { flex: 1; display: flex; align-items: center; justify-content: center; text-align: center; font-weight: 900; font-size: 14.5px; padding: 6px 0; line-height: 1.2; }

  .scrim { position: absolute; inset: 0; background: rgba(0,0,0,.55); z-index: 45; opacity: 0; pointer-events: none; transition: .2s; }
  .scrim.open { opacity: 1; pointer-events: auto; }
  .sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 50;
    background: var(--panel); border-top-left-radius: 26px; border-top-right-radius: 26px;
    border-top: 3px solid var(--pink); max-height: calc(100dvh - var(--headerH, 74px) - 6px); overflow-y: auto;
    transform: translateY(100%); transition: transform .25s ease; padding: 8px 18px calc(20px + var(--sab)); }
  .sheet.open { transform: translateY(0); }
  .handle { width: 44px; height: 5px; border-radius: 3px; background: var(--line); margin: 8px auto 12px; }
  .sheet h2 { font-size: 20px; margin: 0 0 14px; font-weight: 900;
    background: linear-gradient(90deg, var(--pink), var(--yellow)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 6px; font-weight: 800; }
  .field input, .field select, .field textarea { width: 100%; padding: 13px; border-radius: 13px; border: 2px solid var(--line); background: var(--panel-2); color: var(--ink); font-size: 16px; font-weight: 600; }
  .field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--pink); }
  .field textarea { resize: vertical; min-height: 56px; }
  .field .hint { font-size: 11px; color: var(--muted); margin-top: 5px; font-weight: 600; }
  .field .hint a { color: var(--cyan); }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  /* collapsible settings sections */
  .sect { border: 2px solid var(--line); border-radius: 14px; margin-bottom: 12px; background: var(--panel-2); overflow: hidden; }
  .sect > summary { list-style: none; cursor: pointer; padding: 14px; font-weight: 800; font-size: 15px; display: flex; align-items: center; justify-content: space-between; }
  .sect > summary::-webkit-details-marker { display: none; }
  /* same OS-accent focus ring problem as the icon buttons — a gold box appeared
     round whichever section had last been tapped */
  .sect > summary:focus { outline: none; }
  .sect > summary:focus-visible { outline: 2px solid var(--cyan); outline-offset: -2px; }
  .sect > summary .chev { transition: transform .2s; color: var(--muted); font-size: 22px; line-height: 1; }
  .sect[open] > summary .chev { transform: rotate(90deg); }
  .sect > summary .sglabel { display: flex; align-items: center; gap: 9px; }
  .mi { flex: none; width: 19px; height: 19px; color: var(--cyan);
    filter: drop-shadow(0 0 5px rgba(0,229,255,.5)); }
  .mi svg { width: 100%; height: 100%; display: block; }
  .sect-body { padding: 2px 14px 14px; }
  /* Decks is a direct action now, not an expandable section — styled to match a
     section header so the menu still reads as one consistent list. */
  .sectbtn { width: 100%; appearance: none; cursor: pointer; text-align: left;
    border: 2px solid var(--line); border-radius: 14px; margin-bottom: 12px;
    background: var(--panel-2); color: var(--ink); padding: 14px;
    font-weight: 800; font-size: 15px; display: flex; align-items: center;
    justify-content: space-between; }
  .sectbtn .sglabel { display: flex; align-items: center; gap: 9px; }
  .sectbtn .chev { color: var(--muted); font-size: 22px; line-height: 1; }
  .sectbtn:active { transform: scale(.99); }
  .sectbtn[hidden] { display: none; }
  .sectbtn:focus { outline: none; }
  .sectbtn:focus-visible { outline: 2px solid var(--cyan); outline-offset: -2px; }
  /* Create a deck / Deck options now sit inside Decks — recess them so the
     nesting reads, and don't double up the panel background. */
  .sect .sect.sub { background: rgba(0,0,0,.22); border-color: rgba(255,255,255,.10);
    margin: 10px 0 0; border-radius: 12px; }
  .sect .sect.sub > summary { padding: 12px 13px; font-size: 14px; }
  .sect .sect.sub .sect-body { padding: 2px 13px 13px; }
  .sect-body .field:last-child { margin-bottom: 2px; }
  .btn { appearance: none; border: none; background: rgba(255,255,255,.12); color: var(--ink); padding: 15px; border-radius: 14px; cursor: pointer; font-size: 16px; font-weight: 900; width: 100%; }
  .btn.primary { background: linear-gradient(135deg, var(--pink), var(--orange)); box-shadow: 0 10px 28px rgba(255,45,120,.5); color: #fff; }
  .btn.primary:active { filter: brightness(1.08); }
  .btn:disabled { opacity: .5; box-shadow: none; }
  .btn-row { display: flex; gap: 10px; margin-top: 4px; }
  .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-bottom: 18px; }
  .menu-grid .btn { padding: 13px 8px; font-size: 13.5px; }
  .btn.sm { padding: 12px; font-size: 14px; }
  /* Home screen actions: dark glass in a cyan->violet gradient edge, the same
     two colours as the header rule and the board's bezel. The gradient lives on
     the border via two backgrounds — padding-box for the face, border-box for
     the edge — so the corners stay properly rounded. */
  .homebtn { position: relative; display: flex; align-items: center; gap: 9px;
    padding: 12px 15px;
    border: 1.5px solid transparent; border-radius: 15px; overflow: hidden;
    background: linear-gradient(180deg, #182033, #0d1220) padding-box,
                linear-gradient(140deg, var(--cyan), var(--violet)) border-box;
    box-shadow: 0 10px 26px rgba(0,0,0,.45), 0 0 18px rgba(0,229,255,.10), inset 0 1px 0 rgba(255,255,255,.10);
    transition: transform .12s ease, box-shadow .12s ease; }
  .homebtn::after { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 52%;
    background: linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,0)); pointer-events: none; }
  .homebtn:active { transform: translateY(2px) scale(.985);
    box-shadow: 0 4px 14px rgba(0,0,0,.5), 0 0 24px rgba(0,229,255,.26), inset 0 1px 0 rgba(255,255,255,.08); }
  .hb-ico { flex: none; width: 21px; height: 21px; color: var(--cyan);
    filter: drop-shadow(0 0 6px rgba(0,229,255,.55)); }
  .hb-ico svg { width: 100%; height: 100%; display: block; }
  .hb-txt { flex: 1; min-width: 0; text-align: center; }
  .hb-txt b { font-size: 14px; font-weight: 900; letter-spacing: .04em; text-transform: uppercase; color: #fff; }
  .hb-txt small { font-size: 11.5px; font-weight: 600; color: var(--muted); }
  .hb-go { flex: none; width: 13px; height: 13px; color: rgba(255,255,255,.45); }
  .hb-go svg { width: 100%; height: 100%; display: block; }
  /* Same treatment, scaled to sit among the menu rows rather than dominate them */
  .homebtn.compact { padding: 10px 13px; gap: 11px; border-radius: 13px; }
  .homebtn.compact .hb-ico { width: 20px; height: 20px; }
  .homebtn.compact .hb-txt b { font-size: 14px; letter-spacing: .04em; }
  .homebtn.compact .hb-txt small { font-size: 11.5px; }
  .homebtn.compact .hb-go { width: 13px; height: 13px; }
  /* All three home actions share one treatment — no lead/ghost variants. */

  /* cloud overlay */
  .tabs { display: flex; gap: 8px; padding: 12px 14px 6px; }
  .tab { flex: 1; padding: 11px; border-radius: 12px; border: 2px solid var(--line); background: rgba(255,255,255,.06); color: var(--muted); font-weight: 800; font-size: 14px; cursor: pointer; }
  .tab.active { background: linear-gradient(135deg, var(--pink), var(--orange)); color: #fff; border-color: transparent; }
  #cloudList { flex: 1; overflow-y: auto; padding: 14px; }
  /* Compact single line per deck so the whole library is scannable at once. */
  .deckrow { display: flex; align-items: baseline; gap: 8px; padding: 9px 11px; border-radius: 10px;
    background: rgba(255,255,255,.04); border: 1px solid var(--line); margin-bottom: 6px; cursor: pointer; }
  .deckrow:active { background: rgba(0,229,255,.10); }
  .deckrow .n { flex: 1; min-width: 0; font-weight: 800; font-size: 14.5px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .deckrow .s { flex: none; font-size: 11.5px; color: var(--muted); font-weight: 600; }
  .confirm-row { border: 2px solid var(--danger); border-radius: 14px; padding: 12px 14px; margin-bottom: 12px;
    background: rgba(255,84,112,.08); }
  .confirm-row[hidden] { display: none; }
  .confirm-row .ctxt { display: block; font-size: 13.5px; font-weight: 700; color: #ffd7de; margin-bottom: 10px; }
  .confirm-row .cbtns { display: flex; gap: 8px; }
  .btn.danger { background: var(--danger); color: #fff; }
  .deckrow .del { color: var(--danger); font-size: 19px; padding: 4px 8px; cursor: pointer; }
  .cloud-msg { padding: 34px 20px; text-align: center; color: var(--muted); font-weight: 600; line-height: 1.5; }

  .install { position: absolute; left: 12px; right: 12px; bottom: calc(12px + var(--sab)); z-index: 44;
    background: var(--panel-2); border: 2px solid var(--pink); border-radius: 16px; padding: 13px 15px;
    display: none; align-items: center; gap: 10px; box-shadow: 0 12px 34px rgba(0,0,0,.45); }
  .install.show { display: flex; }
  .install .txt { flex: 1; font-size: 13px; line-height: 1.4; font-weight: 600; }
  .install .x { color: var(--muted); font-size: 20px; cursor: pointer; padding: 0 4px; }

  /* timer modal */
  .modal { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%) scale(.95); z-index: 50; width: min(360px, 88%);
    background: var(--panel); border: 3px solid var(--pink); border-radius: 22px; padding: 20px; text-align: center;
    opacity: 0; pointer-events: none; transition: .2s; }
  .modal.open { opacity: 1; pointer-events: auto; transform: translate(-50%,-50%) scale(1); }
  .modal-title { font-weight: 900; font-size: 16px; margin-bottom: 8px; }
  .tclock { font-size: 58px; font-weight: 900; letter-spacing: 1px; margin: 4px 0 16px; font-variant-numeric: tabular-nums; }
  .tclock.warn { color: var(--yellow); } .tclock.done { color: var(--danger); }
  .tp { padding: 10px 13px; border-radius: 12px; border: 2px solid var(--line); background: rgba(255,255,255,.06); color: #fff; font-weight: 800; cursor: pointer; }
  .tp.active { background: linear-gradient(135deg, var(--cyan), var(--violet)); border-color: transparent; }
  .chip.live { background: linear-gradient(135deg, var(--pink), var(--orange)); color: #fff; border-color: transparent; }

  /* scoreboard */
  .addteam { display: flex; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
  .addteam input { flex: 1; padding: 12px; border-radius: 12px; border: 2px solid var(--line); background: var(--panel-2); color: #fff; font-size: 16px; font-weight: 600; }
  /* same reason as .codeinput:focus — claim the focus ring before the OS does */
  .addteam input:focus, .tname:focus { outline: none; border-color: var(--cyan);
    box-shadow: 0 0 0 3px rgba(0,229,255,.16); }
  .teamrow { display: flex; align-items: center; gap: 10px; padding: 11px 13px; border-radius: 15px; background: var(--panel-2); border: 2px solid var(--line); margin-bottom: 10px; }
  .teamrow .tn { flex: 1; font-weight: 800; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .teamrow .sc { font-size: 26px; font-weight: 900; min-width: 42px; text-align: center; font-variant-numeric: tabular-nums; }
  .teamrow .sbtn { width: 42px; height: 42px; border-radius: 12px; border: none; font-size: 24px; font-weight: 900; color: #fff; cursor: pointer; line-height: 1; }
  .teamrow .sbtn:active { transform: scale(.9); }
  .teamrow .plus { background: linear-gradient(135deg, var(--pink), var(--orange)); }
  .teamrow .minus { background: rgba(255,255,255,.12); }
  .teamrow .rm { color: var(--danger); font-size: 17px; padding: 4px; cursor: pointer; }

  /* Installed fullscreen mode: iOS lays the page out short of the screen by
     the status-bar height. Painting below that line works (the art runs to the
     true bottom edge — verified on-device), but touches down there are not
     dependable — so every interactive footer keeps clear of the line. Keyed
     off an html.pwa class set from JS because the display-mode media query
     does not match on-device even when running installed. */
  html.pwa .live-inner { padding-bottom: max(calc(12px + var(--sab)), calc(var(--sat) + 18px)); }

  html.pwa .empty { padding-bottom: max(calc(12px + var(--sab)), calc(var(--sat) + 12px)); }
  html.pwa .homeveil { height: var(--vpH, 100lvh);
    background: linear-gradient(180deg, rgba(4,6,12,.25) 0%, rgba(4,6,12,0) 20%,
      rgba(4,6,12,0) 50%, rgba(4,6,12,.85) calc(100% - 44px), #04060c 100%); }
  html.pwa .live-view.artbg::after, html.pwa .live-view.vid::after {
    height: var(--vpH, 100lvh); }
  html.pwa .live-view.artbg::after {
    background: linear-gradient(180deg, rgba(11,16,25,0) calc(100% - 90px), #0b1019 100%),
      linear-gradient(180deg, rgba(11,16,25,.55) 0%, rgba(11,16,25,.96) 13%,
      rgba(11,16,25,.86) 31%, rgba(11,16,25,.45) 52%, rgba(11,16,25,0) 70%); }
  html.pwa .live-view.vid::after {
    background: linear-gradient(180deg, rgba(11,16,25,0) calc(100% - 90px), #0b1019 100%),
      linear-gradient(180deg, rgba(11,16,25,.55) 0%, rgba(11,16,25,.96) 13%,
      rgba(11,16,25,.9) 27%, rgba(11,16,25,.62) 51%, rgba(11,16,25,.34) 100%); }

  .rotate-shield { display: none; position: fixed; inset: 0; z-index: 400;
    background: #0b1019; place-items: center; text-align: center; }
  .rotate-shield b { display: block; font-size: 24px; font-weight: 900; color: #fff; }
  .rotate-shield span { display: block; margin-top: 8px; font-size: 14px; color: var(--muted); }
  @media (orientation: landscape) and (max-height: 520px) {
    .rotate-shield { display: grid; } }

  /* time's-up flash */
  .flash { position: absolute; inset: 0; background: var(--danger); opacity: 0; pointer-events: none; z-index: 60; }
  .flash.go { animation: flashfx .55s ease 3; }
  @keyframes flashfx { 0%,100% { opacity: 0; } 50% { opacity: .5; } }

  /* Celebrations: a particle canvas over everything, and a headline that pops
     with it (spinner bonuses, steals, winning the game). */
  .fxcanvas { position: absolute; inset: 0; width: 100%; height: 100%;
    z-index: 70; pointer-events: none; display: none; }
  .fxcanvas.on { display: block; }
  /* Sits in the open space UNDER the turn pill, over the countdown ring, which
     the fxb rule below dims to almost nothing while a banner is up. `top` is
     the banner's centre, and the 155px floor keeps even a two-line banner off
     the pill on a short phone — covering the team name was the old bug. */
  .fxbanner { position: absolute; left: 50%; top: max(30%, 155px); z-index: 71; pointer-events: none;
    transform: translate(-50%, -50%); text-align: center; white-space: nowrap;
    font-size: 38px; font-weight: 900; letter-spacing: -.5px; opacity: 0; color: #fff;
    text-shadow: 0 0 24px rgba(0,229,255,.75), 0 0 60px rgba(138,43,226,.65), 0 6px 30px rgba(0,0,0,.8); }
  /* Its own pool of darkness, so it reads over the ring underneath whatever
     else is going on — the dim below is a bonus, not the thing holding it up. */
  .fxbanner::before { content: ""; position: absolute; inset: -34px -70px; z-index: -1;
    background: radial-gradient(58% 68% at 50% 50%, rgba(4,6,12,.94) 0%, rgba(4,6,12,.8) 48%, rgba(4,6,12,0) 100%); }
  .fxbanner small { display: block; margin-top: 8px; font-size: 13px; letter-spacing: .22em;
    text-transform: uppercase; color: #c2cde6; text-shadow: 0 2px 14px rgba(0,0,0,.8); }
  .fxbanner.go { animation: fxpop var(--bd, 2s) cubic-bezier(.2,1.4,.4,1) both; }
  .fxbanner.out { opacity: 0; transition: opacity .25s; }
  #ring, .tally { transition: opacity .25s; }
  body.fxb #ring, body.fxb .tally { opacity: .05; }
  @keyframes fxpop {
    0% { opacity: 0; transform: translate(-50%,-50%) scale(.4); }
    12% { opacity: 1; transform: translate(-50%,-50%) scale(1.08); }
    22% { transform: translate(-50%,-50%) scale(1); }
    78% { opacity: 1; }
    100% { opacity: 0; transform: translate(-50%,-50%) scale(1.04); }
  }

  /* ---------- LIVE mode ---------- */
  /* Matches the bar's #0b1019 exactly at its top edge — the old bright cyan
     bloom right under the rule made the header look like a separate slab. Any
     glow is kept low, well away from the seam. */
  .live-view { position: absolute; top: var(--headerH, 74px); left: 0; right: 0; bottom: 0; z-index: 55; background:
      radial-gradient(620px 460px at 50% 118%, rgba(138,43,226,.30) 0%, transparent 62%),
      #0b1019; display: none; flex-direction: column; }
  .live-view.open { display: flex; }
  .live-inner { flex: 1; display: flex; flex-direction: column; min-height: 0;
    padding: 8px 16px max(calc(12px + var(--sab)), 40px); }
  .live-top { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .live-top .lt-title { font-weight: 900; font-size: 17px; }
  .live-top .lt-sub { font-size: 12px; color: var(--muted); font-weight: 600; }
  .live-body { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 11px; min-height: 0; }
  .scorestrip { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .scorestrip .sc { background: var(--panel-2); border: 1px solid var(--line); border-radius: 999px; padding: 6px 13px; font-weight: 800; font-size: 13px; }
  .scorestrip .sc.lead { border-color: var(--yellow); }
  .scorestrip .sc b { color: var(--cyan); margin-left: 3px; }
  .live-foot { display: flex; gap: 10px; padding-top: 12px; }

  .lcode { text-align: center; }
  .lcode .lbl { font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); font-weight: 800; }
  .lcode .code { font-size: 46px; font-weight: 900; letter-spacing: 8px; margin: 4px 0; background: linear-gradient(90deg, var(--pink), var(--yellow)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .lqr { display: flex; justify-content: center; margin: 6px 0; }
  .lqr img { width: 176px; height: 176px; image-rendering: pixelated; border-radius: 12px; border: 4px solid #fff; background: #fff; }
  .players { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .ptag { background: var(--panel-2); border: 2px solid var(--line); border-radius: 999px; padding: 8px 14px; font-weight: 800; font-size: 13px; }
  .ptag.host { border-color: var(--pink); }
  .ptag.active { background: linear-gradient(135deg, var(--pink), var(--orange)); border-color: transparent; }

  .lcard { background: var(--panel); border: 2px solid var(--line); border-radius: 16px; padding: 13px; }
  .lcard h4 { margin: 0 0 10px; font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .bigword { font-size: 27px; font-weight: 900; text-align: center; padding: 15px 12px; border-radius: 16px; color: #fff;
    background: linear-gradient(155deg, var(--pink), var(--violet)); border: 3px solid rgba(255,255,255,.5); word-break: break-word; }
  .bigletter { font-size: 66px; font-weight: 900; text-align: center; color: #fff; width: 92px; height: 92px; display: grid; place-items: center; margin: 0 auto;
    border-radius: 20px; background: linear-gradient(135deg, var(--cyan), var(--violet)); border: 3px solid rgba(255,255,255,.5); }
  .bigtimer { font-size: 40px; font-weight: 900; text-align: center; font-variant-numeric: tabular-nums; }
  .bigtimer.warn { color: var(--yellow); } .bigtimer.done { color: var(--danger); }

  .scatfield { margin-bottom: 10px; }
  .scatfield label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 5px; color: var(--muted); }
  .scatfield input { width: 100%; padding: 12px; border-radius: 11px; border: 2px solid var(--line); background: var(--panel-2); color: #fff; font-size: 16px; font-weight: 600; }
  .scatfield input:focus { outline: none; border-color: var(--pink); }
  .scatfield input.good { border-color: #43e97b; }

  .revcat { border-top: 1px solid var(--line); padding: 10px 0; }
  .revcat .rc-cat { font-weight: 800; margin-bottom: 6px; }
  .revans { display: flex; align-items: center; gap: 8px; font-size: 14px; padding: 3px 0; }
  .revans .who { color: var(--muted); font-weight: 700; min-width: 82px; }
  .revans .ans { font-weight: 700; }
  .revans .pt { margin-left: auto; font-weight: 800; }
  .revans .pt.ok { color: #43e97b; } .revans .pt.no { color: var(--muted); }

  .scoretable { display: flex; flex-direction: column; gap: 8px; }
  .scoreitem { display: flex; align-items: center; gap: 10px; background: var(--panel-2); border: 2px solid var(--line); border-radius: 12px; padding: 10px 13px; }
  .scoreitem .nm { flex: 1; font-weight: 800; }
  .scoreitem .pts { font-size: 22px; font-weight: 900; font-variant-numeric: tabular-nums; }
  .scoreitem.lead { border-color: var(--yellow); }

  .drawwrap { position: relative; width: 100%; aspect-ratio: 1/1; max-width: min(320px, 40vh); margin: 0 auto; }
  .drawcanvas { width: 100%; height: 100%; background: #fff; border-radius: 16px; border: 3px solid rgba(255,255,255,.5); touch-action: none; display: block; }
  .drawtools { display: flex; gap: 8px; justify-content: center; margin-top: 10px; flex-wrap: wrap; }
  .swatch { width: 30px; height: 30px; border-radius: 50%; border: 3px solid rgba(255,255,255,.4); cursor: pointer; }
  .swatch.sel { border-color: #fff; transform: scale(1.12); }

  .live-view .btn.mini, .live-foot .btn { padding: 13px; font-size: 15px; }
  .wizbtn { display: flex; flex-direction: column; gap: 3px; align-items: center; padding: 18px 12px; }
  .wizbtn .wl { font-size: 18px; font-weight: 900; }
  .wizbtn .ws { font-size: 12px; font-weight: 600; color: var(--muted); }
  .catchip { margin-top: 9px; border-radius: 12px; padding: 10px; font-weight: 900; font-size: 17px; color: #fff;
    background: linear-gradient(155deg, var(--c1), var(--c2)); border: 2px solid rgba(255,255,255,.35); }
  .lbl2 { font-size: 10px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); font-weight: 800; }
  .tsw { width: 20px; height: 20px; border-radius: 50%; flex: none; border: 2px solid #fff; background: linear-gradient(160deg, var(--t1), var(--t2)); }
  .tname { flex: 1; min-width: 0; padding: 9px 11px; border-radius: 10px; border: 2px solid var(--line); background: var(--panel-2); color: #fff; font-size: 15px; font-weight: 800; }
  .trow2 { display: flex; align-items: center; gap: 9px; padding: 7px 0; font-size: 14px; font-weight: 600; }
  .ptag.tapme { cursor: pointer; border-color: var(--cyan); }
  .ptag.tapme:active { transform: scale(.94); }
  .codeinput { width: 100%; padding: 14px; border-radius: 13px; border: 2px solid var(--line); background: var(--panel-2); color: #fff; font-size: 22px; font-weight: 900; text-align: center; letter-spacing: 6px; text-transform: uppercase; caret-color: var(--cyan); }
  /* Without this the OS draws its own focus ring, which follows the system
     accent colour — gold on this Mac, nothing to do with the app's palette. */
  /* ---- Join screen ---- */
  .live-view.artbg { background: #0b1019; }
  /* Animated backdrop, shown only on the join screen. The poster is the still
     version, so a blocked autoplay (iOS Low Power Mode) degrades to the image. */
  /* Pinned to the physical screen exactly like the home backdrop — anchored to
     the layout box it stopped short at the screen bottom on installed iOS. */
  .joinbg { display: none; position: fixed; top: 0; left: 50%; transform: translateX(-50%);
    width: min(100vw, 480px); height: 100%; height: 100lvh;
    object-fit: cover; object-position: center bottom; z-index: 0; }
  body.bg-video .joinbg { display: block; }
  body.bg-video .live-view { background: transparent; }
  /* The first stop is the app bar's own #0b1019 so there's no colour step where
     the body meets the header; it fades to the artwork further down. */
  .live-view.artbg::after { content: ""; position: fixed; top: 0; left: 50%;
    transform: translateX(-50%); width: min(100vw, 480px); height: 100%; height: 100lvh;
    z-index: 1; pointer-events: none;
    background: linear-gradient(180deg, rgba(11,16,25,.55) 0%, rgba(11,16,25,.96) 13%,
      rgba(11,16,25,.86) 31%, rgba(11,16,25,.45) 52%, rgba(11,16,25,0) 70%); }
  .live-inner { position: relative; z-index: 2; }
  .joinbody { justify-content: center; padding-bottom: 32%; overflow: hidden; }
  .joincard { width: 100%; max-width: 330px; margin: 0 auto; display: flex; flex-direction: column;
    align-items: center; text-align: center; }
  .jointitle { margin: 0; font-size: 40px; font-weight: 900; letter-spacing: -1px; color: #fff;
    text-shadow: 0 4px 26px rgba(0,0,0,.6); }
  .joincard .tagrule { margin: 16px 0 20px; }
  .joinsub { margin: 0 0 42px; font-size: 16px; font-weight: 700; line-height: 1.45; color: #c2cde6; }

  /* Host and Join share this slot so both screens come out the same height and
     their buttons land on the same line. Sized by Host, which is the taller of
     the two (it carries the deck description) and fills it exactly — so
     centring is a no-op there, and it just centres Join's code cells in the
     space between the subtitle and the button. */
  .jslot { width: 100%; min-height: 169px; display: flex; flex-direction: column; justify-content: center; }
  .codewrap { position: relative; cursor: text; width: 100%; }
  /* the real input is invisible but still focused, so the phone keyboard,
     paste and autofill all behave normally */
  .codeinput { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0;
    border: 0; padding: 0; background: none; -webkit-text-fill-color: transparent; }
  .codeinput:focus { outline: none; }
  .codecells { display: grid; grid-template-columns: repeat(4, 1fr); gap: 11px; pointer-events: none; }
  /* gradient edge via padding-box/border-box, same trick as the home buttons */
  .cc { aspect-ratio: 1 / 1.1; display: grid; place-items: center; border-radius: 16px;
    font-size: 34px; font-weight: 900; color: #fff; border: 2px solid transparent;
    background: linear-gradient(180deg, rgba(12,17,32,.92), rgba(8,11,24,.92)) padding-box,
                linear-gradient(150deg, rgba(0,229,255,.35), rgba(138,43,226,.35)) border-box; }
  .cc.filled { background: linear-gradient(180deg, rgba(12,17,32,.92), rgba(8,11,24,.92)) padding-box,
                linear-gradient(150deg, var(--cyan), var(--violet)) border-box; }
  .cc.next { background: linear-gradient(180deg, rgba(16,22,42,.95), rgba(10,14,30,.95)) padding-box,
                linear-gradient(150deg, var(--cyan), var(--violet)) border-box;
    box-shadow: 0 0 18px rgba(138,43,226,.35); }
  .caret { display: block; width: 3px; height: 34px; border-radius: 2px; background: var(--cyan);
    animation: blink 1.1s steps(1) infinite; }
  @keyframes blink { 0%,49% { opacity: 1 } 50%,100% { opacity: 0 } }

  /* Host screen: the deck picker sits where the code cells sit on Join, with
     the chosen deck confirmed in a panel directly above it. */
  /* Deck info sits above the picker as plain type, not another card — a second
     bordered box directly above the dropdown just repeated the deck name. */
  /* The block always occupies the same height — reserved even before a deck is
     picked — so switching between a 2-line and a 3-line description never
     shifts the dropdown and button underneath it. */
  .deckinfo { width: 100%; margin-bottom: 20px; }
  .di-blurb { margin: 0 0 12px; font-size: 14.5px; font-weight: 600; line-height: 1.5; color: #c2cde6;
    height: calc(14.5px * 1.5 * 3); overflow: hidden;
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; }
  /* explicit height: empty spans would otherwise collapse the row before a deck
     is picked, and the block would grow by that much on first selection */
  .di-stats { display: flex; align-items: center; justify-content: center; gap: 10px; height: 15px;
    font-size: 11.5px; font-weight: 900; letter-spacing: .12em; text-transform: uppercase; color: var(--cyan); }
  .di-stats i { width: 4px; height: 4px; border-radius: 50%; background: var(--violet); }
  .pickfield { position: relative; width: 100%; }
  /* picker and the reveal button share a row; the eye stays square and pinned
     to the top so a list opening below can't stretch it */
  .pickrow { display: flex; align-items: flex-start; gap: 10px; }
  .pickrow #menuPick { flex: 1; min-width: 0; }
  .eyebtn { flex: none; width: 58px; height: 58px; appearance: none; cursor: pointer;
    display: grid; place-items: center; border-radius: 16px; border: 2px solid transparent;
    color: var(--cyan);
    background: linear-gradient(180deg, rgba(12,17,32,.92), rgba(8,11,24,.92)) padding-box,
                linear-gradient(150deg, rgba(0,229,255,.55), rgba(138,43,226,.55)) border-box; }
  .eyebtn svg { width: 25px; height: 25px; display: block;
    filter: drop-shadow(0 0 6px rgba(0,229,255,.45)); }
  .eyebtn:active { transform: scale(.95); }
  .eyebtn:focus { outline: none; }
  .eyebtn:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
  /* In the sheet the list sits in the flow and grows the section, rather than
     floating over it — the section clips overflow for its rounded corners, so
     an absolutely-positioned list was cut off after the first option. */
  #menuPick .picklist { position: static; margin-top: 8px; max-height: 38vh; }
  /* The field: icon pinned left, chevron pinned right, name centred between. */
  .pickbtn { position: relative; width: 100%; appearance: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    padding: 17px 54px; border-radius: 16px; border: 2px solid transparent;
    font-size: 16px; font-weight: 800; color: #fff;
    background: linear-gradient(180deg, rgba(12,17,32,.92), rgba(8,11,24,.92)) padding-box,
                linear-gradient(150deg, rgba(0,229,255,.55), rgba(138,43,226,.55)) border-box; }
  .pickfield.open .pickbtn { background: linear-gradient(180deg, rgba(16,22,42,.96), rgba(10,14,30,.96)) padding-box,
                linear-gradient(150deg, var(--cyan), var(--violet)) border-box; }
  .pickbtn:focus { outline: none; }
  .pickbtn:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
  /* Generate is styled as a picker field so the menu reads as one family */
  .genbtn { margin-top: 4px; }
  .genbtn:disabled { opacity: .6; }
  .pick-label { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pick-ico { position: absolute; left: 17px; top: 50%; transform: translateY(-50%);
    width: 25px; height: 25px; color: var(--cyan); pointer-events: none;
    filter: drop-shadow(0 0 6px rgba(0,229,255,.45)); }
  .pick-ico svg, .po-ico svg { width: 100%; height: 100%; display: block; }
  .pick-chev { position: absolute; right: 18px; top: 50%; transform: translateY(-50%);
    width: 18px; height: 18px; color: var(--cyan); pointer-events: none; transition: transform .18s; }
  .pickfield.open .pick-chev { transform: translateY(-50%) rotate(180deg); }

  /* Themed option list — a native <select> popup is drawn by the OS and can't
     be styled, which is why it looked out of place. */
  .picklist { position: absolute; left: 0; right: 0; top: calc(100% + 8px); z-index: 30;
    /* sized to fit under the field on a 393x852 phone — 46vh ran 59px off
       the bottom of the screen */
    max-height: 32vh; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
    padding: 6px; border-radius: 16px; border: 2px solid transparent;
    background: linear-gradient(180deg, #121a2c, #0a0e1c) padding-box,
                linear-gradient(150deg, var(--cyan), var(--violet)) border-box;
    box-shadow: 0 18px 44px rgba(0,0,0,.6); }
  .picklist[hidden] { display: none; }
  .pickopt { width: 100%; appearance: none; border: none; cursor: pointer; text-align: left;
    display: flex; align-items: center; gap: 12px; padding: 11px 12px; border-radius: 11px;
    background: transparent; color: var(--ink); font-size: 15px; font-weight: 800; }
  .pickopt + .pickopt { margin-top: 2px; }
  .pickopt .po-ico { flex: none; width: 22px; height: 22px; color: var(--muted); }
  .pickopt.on { background: rgba(0,229,255,.12); color: var(--cyan); }
  .pickopt.on .po-ico { color: var(--cyan); }
  .pickopt:active { background: rgba(0,229,255,.18); }

  .joingo { margin-top: 40px; width: 100%; appearance: none; border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 12px;
    padding: 17px; border-radius: 999px; font-size: 19px; font-weight: 900; color: #fff;
    background: linear-gradient(100deg, var(--cyan), #6a5bff 55%, #c840ff);
    box-shadow: 0 10px 34px rgba(106,91,255,.45), 0 0 22px rgba(0,229,255,.25); }
  .joingo svg { width: 21px; height: 21px; }
  .joingo:active { transform: translateY(2px); }
  .joingo:disabled { opacity: .45; box-shadow: none; cursor: default; }


  .lhint { text-align: center; color: var(--muted); font-weight: 600; font-size: 13px; line-height: 1.5; }

  /* ---------- Game screens ----------
     Lobby → teams → play → control → result, in the same language as the Host
     and Join screens. Solo and live run the identical screens; solo just skips
     the lobby, so anything room-specific here is what live adds on top. */
  /* A category-coloured glow behind the heading was tried here and looked like
     a grey slab on the silver control screens — the word card and ring carry
     the category colour on their own, so the backdrop stays plain. */
  .live-view.game { background:
      radial-gradient(620px 460px at 50% 118%, rgba(138,43,226,.26) 0%, transparent 62%),
      #0b1019; }
  /* The Host/Join animated backdrop appears on selected game screens only —
     the solo team setup and the winners page — via the "vid" class, under a
     slightly stronger veil so cards and buttons stay legible. Mid-game turns
     stay on the plain backdrop so the word is the loudest thing on screen. */
  .live-view.vid::after { content: ""; position: fixed; top: 0; left: 50%;
    transform: translateX(-50%); width: min(100vw, 480px); height: 100%; height: 100lvh;
    z-index: 1; pointer-events: none;
    background: linear-gradient(180deg, rgba(11,16,25,.55) 0%, rgba(11,16,25,.96) 13%,
      rgba(11,16,25,.9) 27%, rgba(11,16,25,.62) 51%, rgba(11,16,25,.34) 100%); }
  .gs { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .gs-head { flex: none; text-align: center; margin-bottom: 12px; }
  .gs-title { margin: 0; font-size: 26px; font-weight: 900; letter-spacing: -.6px; color: #fff;
    text-shadow: 0 4px 26px rgba(0,0,0,.6); }
  .gs-head .tagrule { margin: 10px auto 0; }
  /* In the menu the picker shares its row with the All-cards eye, so it can't
     carry the wide padding the full-width Host picker uses: the longer deck
     names were being clipped to "80s & 90s No…". Host is untouched. */
  /* Compact variant of the deck picker: in the menu it shares its row with the
     All-cards eye, so it can't carry the wide padding the full-width Host
     picker uses — the longer deck names were clipping to "80s & 90s No…".
     Every built-in name now fits with the icon still clear of the text. */
  .pickrow .pickbtn { padding-left: 14px; padding-right: 14px; gap: 10px; }
  .pickrow .pick-label { font-size: 15px; }
  .pickrow .eyebtn { width: 46px; flex: 0 0 46px; }

  .gs-sub { margin: 12px 0 0; font-size: 14px; font-weight: 700; color: #b3c0da; }
  /* the room's terms in one quiet line, under the code */
  .gs-note { margin: -4px 0 2px; text-align: center; font-size: 12px; font-weight: 800;
    letter-spacing: .04em; text-transform: uppercase; color: rgba(179,192,218,.62); }
  /* Long screens (lobby, teams) scroll from the top; short ones centre. Centring
     an overflowing column clips its head, so it's opt-in rather than default. */
  /* overflow-x hidden: the rotated "wins!" pokes past the column's box, and the
     resulting horizontal scrollbar drew a grey line across the result screen */
  .gs-body { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden;
    display: flex; flex-direction: column; gap: 14px; }
  /* Centred screens sit a touch high, like Host and Join — dead centre leaves a
     matching void above and below and both read as accidental. */
  .gs-body.mid { justify-content: center; justify-content: safe center;
    padding-bottom: clamp(0px, 9vh, 96px); }
  .gs-body.mid .gs-head { margin-bottom: 6px; }
  .gs-foot { flex: none; display: flex; gap: 10px; padding-top: 12px; }

  /* Panel — the same gradient hairline as the pickers and code cells. */
  .gpanel { border-radius: 18px; border: 2px solid transparent; padding: 13px;
    background: linear-gradient(180deg, rgba(12,17,32,.92), rgba(8,11,24,.92)) padding-box,
                linear-gradient(150deg, rgba(0,229,255,.35), rgba(138,43,226,.35)) border-box; }
  .gpanel > h4 { margin: 0 0 12px; font-size: 10.5px; font-weight: 900; letter-spacing: .16em;
    text-transform: uppercase; color: #7f8db0; text-align: center; }

  /* Spinner payout: take the places, or take them off someone */
  .spinpick .gbtn { margin: 0; }
  .spor { margin: 13px 0 11px; text-align: center; font-size: 11px; font-weight: 900;
    letter-spacing: .16em; text-transform: uppercase; color: #7f8db0; }
  .spback { display: flex; flex-direction: column; gap: 8px; }
  .spback .gbtn { width: 100%; flex: none; justify-content: flex-start; gap: 11px; padding: 15px 17px; }
  .tdot { width: 13px; height: 13px; border-radius: 50%; flex: none;
    background: linear-gradient(140deg, var(--t1), var(--t2)); }

  /* Whose turn — ONE pill: dot, role, board position. Full scores live on
     the TV board and the winners page; four pills of numbers were noise. */
  .upbar { margin: 0 auto; width: fit-content; max-width: 100%; display: flex;
    align-items: center; gap: 9px; padding: 10px 17px; border-radius: 999px;
    font-size: 14.5px; font-weight: 900; letter-spacing: .02em; }
  .upbar i { width: 11px; height: 11px; border-radius: 50%; flex: none;
    background: linear-gradient(160deg, var(--t1), var(--t2)); }
  .upbar b { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .upbar small { font-size: 11.5px; font-weight: 800; letter-spacing: .06em; flex: none; }
  .upbar.mine { background: linear-gradient(120deg, var(--t1), var(--t2)); color: #fff;
    animation: rolepulse 1.6s ease-in-out infinite; }
  .upbar.mine i { background: #fff; box-shadow: 0 0 8px rgba(255,255,255,.8); }
  .upbar.mine small { color: rgba(255,255,255,.75); }
  .upbar.theirs { border: 2px solid transparent; color: #c2cde6; opacity: .9;
    background: linear-gradient(180deg, rgba(12,17,32,.9), rgba(8,11,24,.9)) padding-box,
                linear-gradient(140deg, var(--t1), var(--t2)) border-box; }
  .upbar.theirs small { color: #8b99b8; }
  @keyframes rolepulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.04); } }

  /* One bar says it all: the active team is the loud named pill with its board
     position; the other teams collapse to a coloured dot + position. The board
     on the TV carries the full scoreboard, so the phone stays quiet. */
  .teamsbar { display: flex; align-items: center; justify-content: center; gap: 8px;
    flex-wrap: wrap; }
  .tb { display: inline-flex; align-items: center; gap: 7px; border-radius: 999px;
    padding: 6px 11px; border: 2px solid transparent; opacity: .72;
    font-size: 12px; font-weight: 800; color: #c2cde6;
    background: linear-gradient(180deg, rgba(12,17,32,.9), rgba(8,11,24,.9)) padding-box,
                linear-gradient(140deg, var(--t1), var(--t2)) border-box; }
  .tb i { width: 9px; height: 9px; border-radius: 50%; flex: none;
    background: linear-gradient(160deg, var(--t1), var(--t2)); }
  .tb b { color: #fff; font-variant-numeric: tabular-nums; }
  .tb.on { opacity: 1; padding: 9px 15px; font-size: 13.5px;
    background: linear-gradient(180deg, rgba(12,17,32,.94), rgba(8,11,24,.94)) padding-box,
                linear-gradient(120deg, var(--t1), var(--t2)) border-box;
    box-shadow: 0 0 18px -4px var(--t1); }
  .tb.on i { width: 11px; height: 11px; box-shadow: 0 0 10px var(--t1); }
  .tb.on b { max-width: 40vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tb.on small { font-size: 12px; font-weight: 800; color: #8b99b8;
    letter-spacing: .06em; }

  /* Countdown ring — reads at arm's length across the room. */
  .ring { position: relative; width: 136px; height: 136px; margin: 0 auto; flex: none; }
  .ring svg { width: 100%; height: 100%; display: block; transform: rotate(-90deg); }
  .ring .trk { fill: none; stroke: rgba(255,255,255,.08); stroke-width: 9; }
  /* Brand-gradient sweep — the category colour lives on the word card, so the
     clock stays the same jewel on every turn. The glow is a round box-shadow
     on the container, NOT a drop-shadow filter on the arc: the filter promoted
     a compositing layer whose square bounds showed as a faint slab. */
  .ring .prg { fill: none; stroke: url(#ringGrad); stroke-width: 9; stroke-linecap: round;
    transition: stroke-dashoffset .32s linear, stroke .3s; }
  .ring::before { content: ""; position: absolute; inset: 5px; border-radius: 50%;
    box-shadow: 0 0 26px rgba(138,43,226,.4), 0 0 46px rgba(0,229,255,.16),
                inset 0 0 24px rgba(138,43,226,.22); }
  .ring.idle::before { box-shadow: none; }
  .ring.warn .prg { stroke: var(--yellow); }
  .ring.warn::before { box-shadow: 0 0 26px rgba(255,209,0,.35), inset 0 0 24px rgba(255,209,0,.14); }
  .ring.done .prg { stroke: var(--danger); }
  .ring.done::before { box-shadow: 0 0 26px rgba(255,45,85,.4), inset 0 0 24px rgba(255,45,85,.18); }
  .ring .num { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
  .ring .num b { font-size: 45px; font-weight: 900; line-height: 1; font-variant-numeric: tabular-nums; }
  .ring .num small { display: block; margin-top: 5px; font-size: 9.5px; font-weight: 900;
    letter-spacing: .16em; text-transform: uppercase; color: #7f8db0; }
  .ring.warn .num b { color: var(--yellow); }
  .ring.done .num b { color: var(--danger); }
  .ring.idle .prg { display: none; }

  /* One pip per correct answer = one space on the board. */
  .tally { display: flex; align-items: center; justify-content: center; gap: 7px; flex-wrap: wrap;
    min-height: 12px; }
  .tally .pip { width: 12px; height: 12px; border-radius: 50%; background: rgba(255,255,255,.13); }
  .tally .pip.on { background: linear-gradient(160deg, var(--pink), var(--violet));
    box-shadow: 0 0 10px rgba(255,47,208,.6); animation: pippop .35s cubic-bezier(.2,1.6,.4,1); }
  @keyframes pippop { 0% { transform: scale(.2); } 60% { transform: scale(1.5); } 100% { transform: scale(1); } }
  .tally .pipmore { font-size: 12px; font-weight: 900; color: var(--cyan); margin-left: 2px; }

  /* The word itself, in its category's colours. Text uses the category's own ink
     so yellow and cyan cards stay readable instead of white-on-bright. */
  .wordcard { border-radius: 22px; padding: 24px 16px; text-align: center;
    background: linear-gradient(155deg, var(--c1), var(--c2)); color: var(--ink, #fff);
    box-shadow: 0 18px 44px rgba(0,0,0,.45); }
  .wordcard .cat { display: inline-block; padding: 5px 14px; border-radius: 999px;
    font-size: 10.5px; font-weight: 900; letter-spacing: .16em; text-transform: uppercase;
    background: rgba(0,0,0,.22); }
  .wordcard .w { margin: 14px 0 0; font-size: 31px; font-weight: 900; line-height: 1.15;
    word-break: break-word; }
  .wordcard .v { margin-top: 10px; font-size: 11px; font-weight: 800; letter-spacing: .12em;
    text-transform: uppercase; opacity: .6; }
  .wordcard.quiet { background: linear-gradient(180deg, rgba(12,17,32,.92), rgba(8,11,24,.92));
    border: 2px solid transparent; color: #fff; box-shadow: none;
    background: linear-gradient(180deg, rgba(12,17,32,.92), rgba(8,11,24,.92)) padding-box,
                linear-gradient(150deg, var(--c1), var(--c2)) border-box; }
  .wordcard.quiet .cat { background: linear-gradient(120deg, var(--c1), var(--c2)); color: var(--ink,#fff); }
  .wordcard.quiet .w { font-size: 26px; }

  /* A Draw turn carries a canvas as well, which pushed the ring off the top and
     the canvas off the bottom. Everything else shrinks so the whole turn fits
     without scrolling — you can't go hunting for the clock mid-sketch. */
  /* the fit is exact, so no scrolling and none of .mid's bottom bias —
     with them the screen overflowed by its own padding and scrolled */
  .gs.draw .gs-body { gap: 10px; padding-bottom: 0; overflow-y: hidden; }
  .gs.draw .ring { width: 78px; height: 78px; }
  .gs.draw .ring .num b { font-size: 30px; }
  .gs.draw .ring .num small { display: none; }
  .gs.draw .ring .trk, .gs.draw .ring .prg { stroke-width: 12; }
  .gs.draw .wordcard { padding: 13px 14px; }
  .gs.draw .wordcard .w { margin-top: 9px; font-size: 23px; }
  .gs.draw .wordcard .v { display: none; }
  .gs.draw .gpanel { padding: 11px; }
  .gs.draw .drawpanel { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
  .gs.draw .drawwrap { flex: 1 1 auto; min-height: 110px; max-height: 340px;
    width: auto; max-width: 100%; aspect-ratio: 1/1; margin: 0 auto; }
  .gs.draw .drawtools { flex: none; }

  /* Buttons: one gradient pill per screen, ghosts for the rest. */
  /* no glow: the halo bled into the screen-bottom vignette and spotlighted
     the strip iOS won't let us paint */
  .gbtn { flex: 1; appearance: none; border: none; cursor: pointer; display: flex;
    align-items: center; justify-content: center; gap: 9px; padding: 14px;
    border-radius: 999px; font-size: 16px; font-weight: 900; color: #fff;
    background: linear-gradient(100deg, var(--cyan), #6a5bff 55%, #c840ff); }
  .gbtn svg { width: 18px; height: 18px; flex: none; }
  .gbtn:active { transform: translateY(2px); }
  .gbtn:disabled { opacity: .45; box-shadow: none; cursor: default; transform: none; }
  /* a used-up skip keeps its place in the row rather than disappearing under a
     thumb that's already on the way down; it just reads spent */
  .gbtn.spent { opacity: .42; }
  .gbtn.ghost { flex: none; padding: 17px 20px; font-size: 15px; box-shadow: none;
    border: 2px solid transparent; color: #c2cde6;
    background: linear-gradient(180deg, rgba(12,17,32,.92), rgba(8,11,24,.92)) padding-box,
                linear-gradient(150deg, rgba(0,229,255,.4), rgba(138,43,226,.4)) border-box; }
  .gbtn.wait { background: linear-gradient(180deg, rgba(12,17,32,.9), rgba(8,11,24,.9));
    border: 2px dashed rgba(255,255,255,.16); color: #7f8db0; font-size: 15px;
    box-shadow: none; cursor: default; }
  .gbtn.wait:active { transform: none; }

  /* Team setup */
  .tcount { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .tcount button { appearance: none; cursor: pointer; padding: 14px 0; border-radius: 14px;
    border: 2px solid transparent; font-size: 17px; font-weight: 900; color: #fff;
    background: linear-gradient(180deg, rgba(12,17,32,.92), rgba(8,11,24,.92)) padding-box,
                linear-gradient(150deg, rgba(0,229,255,.3), rgba(138,43,226,.3)) border-box; }
  .tcount button.on { color: var(--cyan);
    background: linear-gradient(180deg, rgba(16,22,42,.96), rgba(10,14,30,.96)) padding-box,
                linear-gradient(150deg, var(--cyan), var(--violet)) border-box;
    box-shadow: 0 0 20px rgba(138,43,226,.28); }
  .tcard { border-radius: 18px; border: 2px solid transparent; padding: 13px;
    background: linear-gradient(180deg, rgba(12,17,32,.92), rgba(8,11,24,.92)) padding-box,
                linear-gradient(140deg, var(--t1), var(--t2)) border-box; }
  .tcard-h { display: flex; align-items: center; gap: 10px; margin-bottom: 11px; }
  /* The team name is editable and nobody could tell: it looked like a label.
     Dashed edge plus a pencil says "tap me", and it lights up like a field the
     moment it has focus. */
  .tcard .tname { border: 1.5px dashed rgba(255,255,255,.22); background: rgba(255,255,255,.05);
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='rgba(255,255,255,0.45)' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M4 20h4l10-10-4-4L4 16Z'/><path d='m14.5 5.5 4 4'/></svg>");
    background-repeat: no-repeat; background-position: right 10px center; background-size: 15px 15px;
    padding-right: 32px; }
  .tcard .tname:focus { border-style: solid; background-image: none; padding-right: 11px; }
  .tmem { display: flex; flex-wrap: wrap; gap: 7px; }
  .tmem .who { border-radius: 999px; padding: 8px 13px; font-weight: 800; font-size: 13px;
    border: 2px solid transparent; cursor: pointer; color: #fff;
    background: linear-gradient(180deg, rgba(255,255,255,.07), rgba(255,255,255,.03)) padding-box,
                linear-gradient(150deg, var(--t1), var(--t2)) border-box; }
  .tmem .who:active { transform: scale(.94); }
  .tmem .who.bot { color: #b6c3de; }
  .tmem .none { font-size: 12.5px; font-weight: 700; color: #6f7d9e; padding: 8px 2px; }

  /* Room code, shown in the very cells the joining player types into. */
  .roomcode { display: grid; grid-template-columns: repeat(4, 1fr); gap: 11px; }
  .roomcode span { aspect-ratio: 1 / 1.1; display: grid; place-items: center; border-radius: 16px;
    font-size: 34px; font-weight: 900; color: #fff; border: 2px solid transparent;
    background: linear-gradient(180deg, rgba(12,17,32,.92), rgba(8,11,24,.92)) padding-box,
                linear-gradient(150deg, var(--cyan), var(--violet)) border-box; }
  .qrbox { display: flex; justify-content: center; }
  .qrbox img { width: 168px; height: 168px; image-rendering: pixelated; border-radius: 14px;
    border: 7px solid #fff; background: #fff; }
  .whos { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .whos .who { border-radius: 999px; padding: 8px 14px; font-weight: 800; font-size: 13px;
    border: 2px solid transparent; color: #dbe4f5;
    background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02)) padding-box,
                linear-gradient(150deg, rgba(0,229,255,.4), rgba(138,43,226,.4)) border-box; }
  .whos .who.me { color: var(--cyan);
    background: linear-gradient(180deg, rgba(0,229,255,.1), rgba(138,43,226,.08)) padding-box,
                linear-gradient(150deg, var(--cyan), var(--violet)) border-box; }

  /* Result */
  .winner { text-align: center; }
  .winner .cup { width: 74px; height: 74px; margin: 0 auto 12px; color: var(--yellow);
    filter: drop-shadow(0 0 18px rgba(255,209,0,.5)); }
  .winner .cup svg { width: 100%; height: 100%; display: block; }
  .winner .nm { font-size: 34px; font-weight: 900; letter-spacing: -.5px;
    background: linear-gradient(100deg, var(--cyan), #c840ff); -webkit-background-clip: text;
    background-clip: text; -webkit-text-fill-color: transparent; }
  .winner .wins { margin-top: 2px; font-size: 25px; font-weight: 900; font-style: italic;
    letter-spacing: .02em; transform: rotate(-3deg); color: var(--yellow);
    text-shadow: 0 0 18px rgba(255,209,0,.55); }
  .standings { display: flex; flex-direction: column; gap: 9px; }
  .strow { display: flex; align-items: center; gap: 11px; border-radius: 14px; padding: 11px 14px;
    border: 2px solid transparent; font-weight: 800;
    background: linear-gradient(180deg, rgba(12,17,32,.92), rgba(8,11,24,.92)) padding-box,
                linear-gradient(140deg, var(--t1), var(--t2)) border-box; }
  /* podium medals: gold, silver, bronze, then slate */
  .strow .medal { flex: none; width: 27px; height: 27px; border-radius: 50%; display: grid;
    place-items: center; font-size: 13px; font-weight: 900; color: #1a1200;
    background: linear-gradient(160deg, #ffe873, #e08700); box-shadow: 0 0 10px rgba(255,209,0,.35); }
  .strow:nth-child(2) .medal { background: linear-gradient(160deg, #e8edf5, #97a3b8);
    color: #1c2230; box-shadow: none; }
  .strow:nth-child(3) .medal { background: linear-gradient(160deg, #e2a05e, #8a5220);
    color: #241100; box-shadow: none; }
  .strow:nth-child(n+4) .medal { background: linear-gradient(160deg, #566078, #2a3242);
    color: #c2cde6; box-shadow: none; }
  .strow .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .strow .pos { font-size: 20px; font-weight: 900; font-variant-numeric: tabular-nums; }

  .spark { display: inline-block; font-size: .55em; vertical-align: .28em; color: var(--pink);

  @keyframes twinkle { 0%,100% { opacity: .45; transform: scale(.8); } 50% { opacity: 1; transform: scale(1.15); } }

  /* Control turn (spade / finish) — silver, matching the board's white spaces. */
  .gs.ctrl .gpanel { background: linear-gradient(180deg, rgba(20,26,42,.94), rgba(10,14,28,.94)) padding-box,

<script>
const $ = (id) => document.getElementById(id);
// installed-app detection that actually works on iOS (see html.pwa CSS)
if ((navigator.standalone === true) ||
    (window.matchMedia && matchMedia("(display-mode: standalone)").matches)) {
  document.documentElement.classList.add("pwa");
  // installed iOS refuses to paint below the layout viewport (proven with
  // anchor bars on-device): innerHeight IS the clip line. Hand it to CSS so
  // the bottom fades complete exactly there.
  const setVp = () => document.documentElement.style.setProperty("--vpH", window.innerHeight + "px");
  setVp();
  window.addEventListener("resize", setVp);
  window.addEventListener("orientationchange", () => { setTimeout(setVp, 120); setTimeout(setVp, 500); });
}
// stamp the running build's version (from the service worker actually serving
// this page) bottom-centre of home, so you always know what you're looking at
fetch("./sw.js").then(r => r.text()).then(t => {
  const m = t.match(/wordsmash-(v\d+)/);
  if (m && $("verBadge")) $("verBadge").textContent = m[1];
  // tap the version to toggle the anchoring test bars
  if ($("verBadge")) $("verBadge").addEventListener("click", () => {
    if (document.querySelector(".dbgbar")) {
      document.querySelectorAll(".dbgbar").forEach(el => el.remove());
      return;
    }
    for (const k of ["r", "y", "c", "g"]) {
      const d = document.createElement("div");
      d.className = "dbgbar " + k;
      document.body.appendChild(d);
    }
  });
}).catch(() => {});
const DEFAULT_MODEL = "deepseek/deepseek-v4-flash";
const LS_KEY = "masgames_or_key", LS_MODEL = "masgames_or_model", LS_DECK = "masgames_deck", LS_GROUP = "masgames_group";
const DEFAULT_GROUP = "Aussie crew, all born in the early 1980s. We grew up on Australian culture plus the American movies, TV, music and games of the '80s and '90s, and still love American pop culture. Lean into that shared nostalgia.";

// A card is painted in its own board category's colours — PERSON yellow, DRAW
// purple, OBJECT cyan and so on — so the card in your hand matches the space
// you're on. Falls back to the old palette only for cards with no known badge.
function catPal(card, i) {
  const C = (window.WORDSMASH && window.WORDSMASH.CATEGORIES) || {};
  const k = String((card && card.badge) || "").toUpperCase();
  if (C[k]) return [C[k].c1, C[k].c2, C[k].ink];
  const p = PALETTES[i % PALETTES.length];
  return [p[0], p[1], "#fff"];
}
const PALETTES = [
