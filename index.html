// Deck size is derived, not a setting. A 48-space board, 1 space per correct
// answer, 4 teams: the winner burns ~48 and the others ~30 each, so a game runs
// ~40 turns. At ~5 correct plus ~2 skips per 30s turn that's ~280 words drawn,
// spread over 7 categories. 210 (30 per category) covers a full game with room
// to skip; the pool wraps after that rather than running dry.
const DECK_TARGET = 210, DECK_BATCH = 105;   // 2 calls — one 210-item response truncates
const FORMAT_SPEC = `Word Smash cards. Each card is ONE word/phrase tagged with a board category. Set "badge" to exactly one of: OBJECT, NATURE, ACTION, PERSON, WORLD, RANDOM, DRAW. Set "title" to the word/phrase to describe out loud (for DRAW, something drawable). Leave "lines" empty and "note" empty. sizeHint = "md". Spread the cards EVENLY across all 7 categories. The board pulls from each, so a thin category means repeated words.`;
function buildPrompt(cfg) {
  let p = `Generate ${cfg.count} unique party game cards.\n\nFORMAT RULES: ${FORMAT_SPEC}\n`;
  if (cfg.groupProfile) p += `PLAYER GROUP (tailor every card so it lands for these people): ${cfg.groupProfile}\n`;
  p += `BRIEF: ${cfg.brief || "general. Draw on the player group's shared culture and nostalgia"}\n`;
  p += `AUDIENCE: ${cfg.audience}\nDIFFICULTY: ${cfg.difficulty}\n`;
  if (cfg.avoid && cfg.avoid.length) p += `Do NOT repeat these already-used titles: ${cfg.avoid.join("; ")}\n`;
  p += `\nReturn ONLY this JSON, minified, with no markdown fences and no commentary:\n`;
  p += `{"deckTitle":"short punchy name","cards":[{"badge":"","title":"","lines":[],"note":"","sizeHint":"md"}]}\n`;
  p += `Every card MUST have a non-empty title. Make them fresh, varied and genuinely on-brief.`;
  return p;
}

// ---------- OpenRouter call ----------
async function callAI(cfg) {
  const key = ($("apiKey").value || "").trim();
  if (!key) throw new Error("Add your OpenRouter API key first (🔑 above).");
  const model = currentModel();
  const res = await fetch("https://openrouter.ai/api/v1/chat/completions", {
    method: "POST",
    headers: {
      "Authorization": "Bearer " + key,
      "Content-Type": "application/json",
      "HTTP-Referer": location.origin || "https://masgames.app",
      "X-Title": "MasGames"
    },
    body: JSON.stringify({
      model, temperature: 0.9,
      messages: [
        { role: "system", content: "You are a witty party-game card writer. You output ONLY valid minified JSON, never markdown or commentary." },
        { role: "user", content: buildPrompt(cfg) }
      ]
    })
  });
  if (!res.ok) {
    let msg = `API error ${res.status}`;
    try { const j = await res.json(); if (j.error?.message) msg += `: ${j.error.message}`; } catch {}
    if (res.status === 401) msg += ". Check your OpenRouter key.";
    if (res.status === 402) msg += ". Out of credit on OpenRouter.";
    throw new Error(msg);
  }
  const data = await res.json();
  const content = data.choices?.[0]?.message?.content || "";
  return parseCards(content);
}

function parseCards(text) {
  let t = String(text).trim();
  t = t.replace(/^```(?:json)?/i, "").replace(/```$/,"").trim();
  let obj = null;
  try { obj = JSON.parse(t); }
  catch {
    const s = t.indexOf("{"), e = t.lastIndexOf("}");
    if (s >= 0 && e > s) { try { obj = JSON.parse(t.slice(s, e + 1)); } catch {} }
  }
  if (!obj || !Array.isArray(obj.cards)) throw new Error("Couldn't read the AI response. Try again, or pick a different model.");
  obj.cards = obj.cards.filter(c => c && ((c.title && c.title.trim()) || (Array.isArray(c.lines) && c.lines.length)));
  if (!obj.cards.length) throw new Error("No usable cards came back. Try again.");
  return obj;
}

function mountDeckPicker(host, opts, onPick) {

  const field = host.querySelector(".pickfield"), btn = host.querySelector(".pickbtn"),
        list  = host.querySelector(".picklist");
  let value = opts.length ? opts[0].v : null;

  const cur = () => opts.find(o => o.v === value) || opts[0];
  function paint() {
    const o = cur(); if (!o) return;
    btn.querySelector(".pick-ico").innerHTML = deckIcon(o.icon);
    btn.querySelector(".pick-label").textContent = o.title;
  }
  function open(on) {
    list.hidden = !on;
    btn.setAttribute("aria-expanded", String(on));
    field.classList.toggle("open", on);
    // clamp a floating list to the space left below the field, so it scrolls
    // inside itself instead of running off the bottom of the phone

      const room = window.innerHeight - btn.getBoundingClientRect().bottom - 84;
      list.style.maxHeight = Math.max(150, room) + "px";
    }

      `<button type="button" class="pickopt${o.v === value ? " on" : ""}" role="option"

       </button>`).join("");
    const sel = list.querySelector(".pickopt.on"); if (sel) sel.scrollIntoView({ block: "nearest" });

// ---------- celebrations ----------
// One particle canvas over the whole app. burst() is a single pop, fireworks()
// launches shells for a while, banner() pops a headline with it. Used for
// spinner bonuses, spade steals and winning — live and solo both go through it.
const FX = (() => {
  const cv = $("fxCanvas"), ctx = cv.getContext("2d");
  const COLORS = ["#00E5FF", "#8A2BE2", "#FFD100", "#FF2FD0", "#43e97b", "#ff7a1a", "#ffffff"];
  let parts = [], raf = 0, until = 0, shellT = 0;
  function fit() {
    const r = cv.getBoundingClientRect(), d = Math.min(2, window.devicePixelRatio || 1);
    if (cv.width !== (r.width * d | 0)) { cv.width = r.width * d; cv.height = r.height * d; }
    return d;
  }
  function spawn(x, y, n, power) {
    const hue = COLORS[Math.random() * COLORS.length | 0];
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, v = (0.25 + Math.random() * 0.75) * power;
      parts.push({ x, y, px: x, py: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - power * 0.22,
        r: 1.4 + Math.random() * 2.2,
        c: Math.random() < 0.55 ? hue : COLORS[Math.random() * COLORS.length | 0],
        life: 1, decay: 0.010 + Math.random() * 0.012 });
    }
  }
  function tick() {
    const d = fit(), W = cv.width / d, H = cv.height / d;
    ctx.setTransform(d, 0, 0, d, 0, 0);
    ctx.clearRect(0, 0, W, H);
    const now = performance.now();
    if (now < until && now > shellT) {           // next firework shell
      shellT = now + 300 + Math.random() * 340;
      if (parts.length < 420)
        spawn(W * (0.18 + Math.random() * 0.64), H * (0.16 + Math.random() * 0.42),
              55 + Math.random() * 25 | 0, 7.5 + Math.random() * 3);
    }
    parts = parts.filter(p => p.life > 0);
    ctx.globalCompositeOperation = "lighter";     // additive: sparks glow
    ctx.lineCap = "round";
    for (const p of parts) {
      p.px = p.x; p.py = p.y;
      p.x += p.vx; p.y += p.vy; p.vy += 0.10; p.vx *= 0.986; p.vy *= 0.986;
      p.life -= p.decay;                          // may cross 0 here, so clamp
      const a = Math.max(0, p.life);
      ctx.globalAlpha = a * 0.9;
      ctx.strokeStyle = p.c; ctx.lineWidth = p.r * a * 2;
      ctx.beginPath(); ctx.moveTo(p.px, p.py); ctx.lineTo(p.x, p.y); ctx.stroke();
      ctx.globalAlpha = a * 0.55;
      ctx.fillStyle = "#ffffff";
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r * a * 0.6, 0, 7); ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = "source-over";
    if (parts.length || now < until) raf = requestAnimationFrame(tick);
    else { raf = 0; cv.classList.remove("on"); }
  }
  const go = () => { cv.classList.add("on"); if (!raf) raf = requestAnimationFrame(tick); };
  return {
    burst(fx = 0.5, fy = 0.55, n = 26, power = 6) {
      const d = fit(); spawn(cv.width / d * fx, cv.height / d * fy, n, power); go();
    },
    fireworks(ms = 2600) { until = performance.now() + ms; shellT = 0; go(); },
    banner(text, sub, ms) {
      const b = $("fxBanner");
      b.innerHTML = esc(text) + (sub ? `<small>${esc(sub)}</small>` : "");
      b.style.setProperty("--bd", (ms || 2000) + "ms");
      b.classList.remove("go", "out"); void b.offsetWidth; b.classList.add("go");
      document.body.classList.add("fxb");
      clearTimeout(this._bt);
      this._bt = setTimeout(() => document.body.classList.remove("fxb"), (ms || 2000) - 150);
    },
    soften() {                       // screen changed under a banner: fade it fast
      const b = $("fxBanner");
      if (b.classList.contains("go")) { b.classList.remove("go"); b.classList.add("out"); }
      document.body.classList.remove("fxb");
    },
  };
})();

    el.style.setProperty("--ink", pal[2]);
    el.classList.toggle("onlight", pal[2] !== "#ffffff");
    const label = (c.title && c.title.trim()) ? c.title : (isListCard(c) ? `${c.lines.length} categories` : (Array.isArray(c.lines) && c.lines.length ? c.lines.join(" · ") : "Card"));
    el.innerHTML = `<div class="badge">${esc(c.badge||"Card")}</div><div class="t">${esc(label)}</div>`;
    el.addEventListener("click", () => { idx = i; renderDeck(); closeGrid(); });
    s.appendChild(el);
  });
}

// ---------- config & generate ----------
function readConfig() {
  return { brief: $("brief").value.trim(), audience: $("audience").value,
    difficulty: $("difficulty").value, groupProfile: groupProfile() };
}
let busy = false;
async function generate(append) {
  if (busy) return;
  const cfg = readConfig();
  busy = true;
  const gb = $("generateBtn");
  if (gb) gb.disabled = true;
  try {
    if (!append) { deck = []; idx = 0; }
    // Batched: a single 210-card response gets truncated by most models, so ask
    // in chunks and pass the titles so far as `avoid` to keep them unique.
    const target = append ? deck.length + DECK_BATCH : DECK_TARGET;
    let guard = 0;
    while (deck.length < target && guard++ < 4) {
      const want = Math.min(DECK_BATCH, target - deck.length);
      showToast(`Generating… ${deck.length}/${target} cards`);
      if ($("genStatus")) $("genStatus").textContent = `Generating… ${deck.length}/${target}`;
      const r = await callAI({ ...cfg, count: want, avoid: deck.map(c => c.title) });
      if (!r.cards || !r.cards.length) break;
      deck = deck.concat(r.cards);
      if (!append && r.deckTitle && deck.length === r.cards.length) { setDeckSub(r.deckTitle); setDeckGame("wordsmash"); }
    }
    if (!deck.length) throw new Error("The model returned no cards. Try again.");
    saveDeck(); renderPlayer(); hideToast(); closeSheet(); shareDeck(); openGrid();
  } catch (e) { showToast(e.message, true); }
  finally {
    busy = false;
    if (gb) gb.disabled = false;
    if ($("genStatus")) $("genStatus").textContent = "Generate deck";
  }
}

// ---------- toast ----------
let toastT = null;
function showToast(msg, err) { const t = $("toast"); t.textContent = msg; t.className = "toast" + (err ? " err" : ""); t.style.display = "block"; if (err) { clearTimeout(toastT); toastT = setTimeout(hideToast, 4500); } }
function hideToast() { $("toast").style.display = "none"; }

// ---------- undo pill ----------
// A short window to take back the last tap. Only one can be up at a time, and
// taking the offer or letting it run out both close it for good.
let undoT = null, undoOutT = null;
function showUndo(label, fn, ms) {
  const d = ms || 4000, b = $("undobar");
  clearTimeout(undoT); clearTimeout(undoOutT);
  b.classList.remove("out");
  b.style.setProperty("--ud", d + "ms");
  b.innerHTML = "";
  b.appendChild(Object.assign(document.createElement("span"), { textContent: label }));
  const btn = Object.assign(document.createElement("button"), { textContent: "Undo", type: "button" });
  btn.addEventListener("click", () => { hideUndo(); try { fn(); } catch {} });
  b.appendChild(btn);
  b.appendChild(document.createElement("i"));
  // going from display:none to flex starts the entry animation, and the drain
  // bar is a brand new element every time, so both replay on their own
  b.style.display = "flex";
  undoT = setTimeout(hideUndo, d);
}
function hideUndo() {
  clearTimeout(undoT); clearTimeout(undoOutT);
  const b = $("undobar");
  if (b.style.display === "none") return;
  b.classList.add("out");
  undoOutT = setTimeout(() => { b.style.display = "none"; b.classList.remove("out"); b.innerHTML = ""; }, 200);
}

// ---------- sheet / grid ----------
function openSheet(){ collapseSheet(); $("sheet").classList.add("open"); $("scrim").classList.add("open"); setHeaderClose(closeSheet); }
function closeSheet(){ $("sheet").classList.remove("open"); $("scrim").classList.remove("open"); setPageTitle(""); setHeaderClose(null); }
// A popup, so it doesn't claim the page title or the app bar's ✕ — it has its
// own close and leaves the screen underneath exactly as it was.
function openGrid(){
  if(!deck.length){ showToast("No cards yet"); return; }
  renderGrid();
  $("cardsTitle").textContent = $("deckSub").textContent || "Deck";
  $("cardsSub").textContent = `${deck.length} cards`;
  $("gridView").classList.add("open");
  $("cardsScrim").classList.add("open");
  $("gridScroll").scrollTop = 0;
}
function closeGrid(){ $("gridView").classList.remove("open"); $("cardsScrim").classList.remove("open"); }

// Home — close everything and fully reset back to the main (empty) screen
function goHome() {
  // Go through each overlay's own close(), not classList.remove(): they're what
  // clear the shared header ✕ and the page title.
  closeSheet(); closeGrid(); closeCloud();
  if ($("liveView").classList.contains("open") && window.MasLive) window.MasLive.leaveLive();
  setPageTitle(""); setHeaderClose(null);   // nothing is open now, whatever happened above
  hideToast();
  // full reset: clear the current deck and return to the home screen
  deck.length = 0; idx = 0;
  localStorage.removeItem(LS_DECK);
  setDeckSub("");
  renderPlayer();
  showToast("Back to home"); setTimeout(hideToast, 1000);
}
$("settingsBtn").addEventListener("click", openSheet);
// Reset wipes the loaded deck, so it asks first.
function showResetConfirm(on) { $("resetConfirm").hidden = !on; $("resetBtn").hidden = on; }

// The menu is an accordion: only one section open at a time, everything
// collapsed whenever the sheet opens, and opening any section counts as
// backing out of a pending reset.
const sheetSections = () => [...document.querySelectorAll("#sheet > details.sect")];
function collapseSheet() { sheetSections().forEach(d => { d.open = false; }); showResetConfirm(false); }
sheetSections().forEach(d => d.addEventListener("toggle", () => {
  if (!d.open) return;                       // only react to a section opening
  showResetConfirm(false);
  sheetSections().forEach(o => { if (o !== d) o.open = false; });
}));
// ---------- game settings ----------
// The host's choices, kept on this device and baked into a room when it's
// created. Changing them never touches a game already in progress.
function paintGameHint() {
  const len = +$("setBoardLen").value, sk = +$("setSkips").value;
  const time = len === 24 ? "about 20 minutes" : "about 40 minutes";
  const skips = sk === 0 ? "no skips" : sk === 1 ? "one skip a turn" : sk + " skips a turn";
  $("gameHint").textContent = `A ${len} space board, ${time}, ${skips}. Set before you host: a game already running keeps the settings it started with.`;
}
(function initGameSettings() {
  const len = $("setBoardLen"), sk = $("setSkips");
  len.value = localStorage.getItem("masgames_boardlen") === "24" ? "24" : "48";
  const s = localStorage.getItem("masgames_skips");
  sk.value = s === null || s === "" ? "1" : String(Math.max(0, Math.min(3, +s | 0)));
  len.addEventListener("change", () => { localStorage.setItem("masgames_boardlen", len.value); paintGameHint(); });
  sk.addEventListener("change", () => { localStorage.setItem("masgames_skips", sk.value); paintGameHint(); });
  paintGameHint();
})();

$("resetBtn").addEventListener("click", () => showResetConfirm(true));
$("resetCancel").addEventListener("click", () => showResetConfirm(false));
$("resetYes").addEventListener("click", () => { showResetConfirm(false); goHome(); });
$("headerClose").addEventListener("click", () => { if (headerCloseFn) headerCloseFn(); });
$("scrim").addEventListener("click", closeSheet);
$("cardsClose").addEventListener("click", closeGrid);
$("cardsScrim").addEventListener("click", closeGrid);
// Menu items live inside the settings sheet, which stacks above these overlays,
// so close the sheet before opening them.
// The menu uses the same dropdown as the Host screen rather than its own list.
let menuPick = null;
function buildMenuPicker() {
  const opts = deckPickerOptions(false);
  menuPick = mountDeckPicker($("menuPick"), opts, paintMenuPick);
  paintMenuPick(menuPick.value);
}
function menuPickedDeck() {
  const all = window.BUILTIN_DECKS || [];
  return menuPick ? all[+menuPick.value] : null;
}
function paintMenuPick() {
  const d = menuPickedDeck();
  $("menuPickGo").title = d ? `See all ${d.cards.length} cards in ${d.title}` : "See all cards";
}
$("menuPickGo").addEventListener("click", () => { const d = menuPickedDeck(); if (d) openDeck(d); });
$("decksSect").addEventListener("toggle", () => { if ($("decksSect").open) { buildMenuPicker(); loadList(); } });
$("generateBtn").addEventListener("click", () => generate(false));

// ---------- cloud (Cloudflare Worker + D1) ----------
// The deck library lives inside the menu sheet now — "opening" it just means
// showing the sheet with the Decks section expanded, no separate page.
function openCloud() { openSheet(); $("decksSect").open = true; loadList(); }
function openCloudLibrary() { openCloud(); }
function closeCloud() { const d = $("decksSect"); if (d) d.open = false; }
function makeQR(text) { try { const qr = qrcode(0, "M"); qr.addData(text); qr.make(); return qr.createDataURL(6); } catch { return null; } }

// Every generated deck goes to the shared library automatically — there's no
// "save" decision to make when the rule is that all decks are shared. Silent by
// design: it must never block or fail the generate that just succeeded.
async function shareDeck() {
  if (!cloudOn() || !deck.length) return;
  try {
    const r = await fetch(API_BASE + "/api/decks", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ title: $("deckSub").textContent, cards: deck, owner: userId, isPublic: true }) });
    if (!r.ok) return;
    loadList();
  } catch (e) { /* offline or Worker down — the deck still works on this phone */ }
}

async function loadList() {
  const el = $("cloudList");
  // One list, no tabs. Built-ins ship with the app and always show; anything
  // saved or shared is appended once the Worker is configured.
  const builtins = (window.BUILTIN_DECKS || []).map((d, i) => ({ ...d, _builtin: i }));
  renderDeckRows(builtins);
  if (!cloudOn()) return;
  try {
    const [mineR, pubR] = await Promise.all([
      fetch(API_BASE + "/api/decks?owner=" + encodeURIComponent(userId)),
      fetch(API_BASE + "/api/decks?public=1"),
    ]);
    const mine = mineR.ok ? await mineR.json() : [];
    const pub  = pubR.ok  ? await pubR.json()  : [];
    const seen = new Set();
    const cloud = [].concat(Array.isArray(mine) ? mine : [], Array.isArray(pub) ? pub : [])
      .filter(d => d && !seen.has(d.id) && seen.add(d.id))
      .map(d => ({ ...d, _mine: (Array.isArray(mine) ? mine : []).some(m => m.id === d.id) }));
    if (cloud.length) renderDeckRows(builtins.concat(cloud));
  } catch (e) { /* offline or Worker down — the built-ins still stand */ }
}

// Shared row renderer for built-in and cloud deck lists
const GAME_LABEL = { gutterhead: "Gutterhead", articulate: "Articulate", scattergories: "Scattergories" };
function renderDeckRows(list) {
  const el = $("cloudList");
  if (!list.length) { el.innerHTML = `<div class="cloud-msg">Nothing here yet.</div>`; return; }
  el.innerHTML = "";
  list.forEach(d => {
    const count = Array.isArray(d.cards) ? d.cards.length : 0;
    const bits = [count + " cards"];
    if (d.audience) bits.push(/spicy/.test(d.audience) ? "18+" : d.audience.replace(/\s*\(.*\)/, ""));
    const row = document.createElement("div");
    row.className = "deckrow";
    // No thumbnail: the swatch was a random palette colour with no meaning, and
    // it made every row tall enough that you could only see a few at a time.
    row.innerHTML = `<span class="n">${esc(d.title || "Untitled")}</span>
      <span class="s">${esc(bits.join(" · "))}</span>
      ${d._mine ? '<span class="del" title="Delete">🗑</span>' : ''}`;
    row.addEventListener("click", () => openDeck(d));
    const del = row.querySelector(".del");
    if (del) del.addEventListener("click", (ev) => { ev.stopPropagation(); if (confirm("Delete this deck?")) deleteDeck(d.id); });
    el.appendChild(row);
  });
}
// .slice() is load-bearing: assigning d.cards directly aliased the built-in
// deck's own array, and goHome() empties `deck` in place — which permanently
// wiped that deck's cards for the rest of the session.
// Picking a deck selects it and shows its cards. There is no card-by-card
// player any more — a selected deck is what Host offers and what All cards lists.
function openDeck(d) {
  deck = Array.isArray(d.cards) ? d.cards.slice() : []; idx = 0;
  setDeckSub(d.title); setDeckGame(d.game || inferGame(deck)); saveDeck();
  renderPlayer(); openGrid();          // stay in the menu; the popup layers over it
}
async function deleteDeck(id) {
  try { await fetch(API_BASE + "/api/decks/" + id + "?owner=" + encodeURIComponent(userId), { method: "DELETE" }); loadList(); }
  catch (e) { showToast(e.message, true); }
}
async function checkShareLink() {
  const did = new URLSearchParams(location.search).get("d");
  if (!did || !cloudOn()) return;
  showToast("Loading shared deck…");
  try {
    const r = await fetch(API_BASE + "/api/decks/" + encodeURIComponent(did));
    if (!r.ok) throw new Error("Shared deck not found");
    const d = await r.json();
    deck = Array.isArray(d.cards) ? d.cards : []; idx = 0; setDeckSub(d.title); setDeckGame(d.game || inferGame(deck)); saveDeck(); renderPlayer(); hideToast();
  } catch (e) { showToast(e.message, true); }
}

// Don't dim the whole Deck library: its "Built-in" tab is the 10 bundled decks
// and needs no Worker at all. Only "Mine" and "Shared" depend on the cloud, so
// mark just those — dimming the button implied nothing in there worked.


// ---------- PWA: service worker + install ----------
if ("serviceWorker" in navigator) window.addEventListener("load", () => {
  // updateViaCache none: check for new versions straight past the CDN's
  // 10-minute cache, or installed apps lag behind for no reason
  navigator.serviceWorker.register("./sw.js", { updateViaCache: "none" }).catch(() => {});
  // the moment a newer build takes over, restart the shell so what you see is
  // what just installed — but never yank the rug mid-game
  let reloaded = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (reloaded) return;
    reloaded = true;
    if (!$("liveView").classList.contains("open")) location.reload();
  });
});
const isStandalone = window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
let deferredPrompt = null;
window.addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); deferredPrompt = e; showInstall("android"); });
function showInstall(kind) {
  if (isStandalone || localStorage.getItem("masgames_install_dismissed")) return;
  const b = $("installBanner");
  if (kind === "ios") { $("installTxt").innerHTML = "Install: tap <b>Share</b> then <b>Add to Home Screen</b>."; $("installBtn").style.display = "none"; }
  else { $("installTxt").textContent = "Install MAS as an app?"; $("installBtn").style.display = ""; }
  b.classList.add("show");
}
$("installBtn").addEventListener("click", async () => { if (deferredPrompt) { deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt = null; $("installBanner").classList.remove("show"); } });
$("installX").addEventListener("click", () => { localStorage.setItem("masgames_install_dismissed","1"); $("installBanner").classList.remove("show"); });
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
if (isIOS && !isStandalone) setTimeout(() => showInstall("ios"), 1500);

// ---------- init ----------
syncHeaderHeight();
renderPageTitle();
renderPlayer();
checkShareLink();
</script>
<script src="./live.js"></script>
</body>
