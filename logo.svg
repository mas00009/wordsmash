<svg viewBox="0 0 120 128" xmlns="http://www.w3.org/2000/svg" fill="none">
  <defs>
    <linearGradient id="neon" x1="16" y1="20" x2="104" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00E5FF"/>
      <stop offset="0.55" stop-color="#00E5FF"/>
      <stop offset="1" stop-color="#8A2BE2"/>
    </linearGradient>
    <linearGradient id="mgrad" x1="42" y1="52" x2="78" y2="86" gradientUnits="userSpaceOnUse">
